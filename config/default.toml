# pdfval default configuration. Override any key with --config my.toml
# (files are deep-merged over this one).

[extract]
use_trimbox = true            # drop printer slugs / crop marks outside the trim box
table_reading_order = true    # read tables row by row, cell by cell (a wrapped cell no longer scrambles the order)
column_reading_order = true   # a page set in two columns is read one column at a time (not row by row across both)
strip_repeating = true        # drop running headers/footers/page numbers
repeat_threshold = 0.3        # ...when the same line sits at the same y on >=30% of pages
ignore_patterns = [           # regexes; matching lines are ignored entirely
  '\.indb\b',
  '^\d{4}/\d{1,2}/\d{1,2}\s',
]

[sections]
source = "auto"               # outline | headings | auto (outline when the PDF has bookmarks)
locate_threshold = 0.8        # fuzzy score to find a bookmark's heading text on its page
title_match_threshold = 0.85  # fuzzy score to pair baseline and candidate headings
front_matter = false          # true = also validate content before the first section (cover page)
page_scope = true             # web page vs PDF: validate only the top-level (L1) chapter(s) the page covers
                              # (by its matched headings or its title); heading levels compared relative to it
skip = []                     # regexes on normalised titles to exclude, e.g. ['^table of contents?$']
missing_severity = "error"
extra_severity = "warning"
level_severity = "warning"
outline_only_severity = "warning"   # heading text exists on both sides, only the PDF bookmark differs

[sections.aliases]            # baseline title = candidate title (renamed headings)
# "table of contents" = "table of content"

[content]
# Content = the text itself: words, case, punctuation (. , : ; quotes, dashes) and the spacing
# between words on a line. Font weight/colour/size are CSS ([style]). Text that is present but
# continues on the next line elsewhere is not an issue at all (see ignore_relocated, check_paragraphs
# and [layout] check_wrap).
# The section verdict is a SCORE: 100 % less issue_weight_pct for each issue in the PDF report:
issue_weight_pct = 0.1        # score = 100 % - 0.1 % for each issue in the PDF report (genuine + image issues)
                              # a section scoring >= pass_pct passes: shown as 100 %, its issues are not subtracted
                              # (in the section or in the document's score)
pass_pct = 98.0               # score % >= pass_pct            -> content PASS
warn_pct = 90.0               # warn_pct <= score % < pass_pct -> content WARN, below -> FAIL
critical_missing_words = 8    # a missing block of >= N prod words is flagged CRITICAL
case_sensitive = true
ignore_quote_style = true     # true = ’ ‘ “ ” are the same as ' " (haven’t = haven't): not reported
normalize_typography = true   # true = also treat – — as - ("steps 2-4" = "steps 2–4": dash style is not reported)
check_spacing = true          # double / missing spaces between words on the same line
ignore_superscript_spacing = true  # the space before / after a superscript (® ™ ¹, a raised footnote mark) is not reported
ignore_footnote_marks = true  # "button" vs "button¹": a raised footnote number on one side only is not a changed word
ignore_relocated = true       # a missing/extra block whose words all exist unmatched on the other side
                              # (wrapped to the next line, another cell order) is not reported
relocated_overlap = 0.85      # ... or at least this share of them (a two-column table read in another row/column
                              # order rarely resolves every single word to the exact same token): the rest is
                              # reported as a smaller, correctly scoped diff instead of the whole block "missing"
relocated_overlap_min_words = 15  # ... only for a block at least this big; a one- or two-word block is already
                              # near 100% "covered" by definition, so relaxing it there would hide a genuine
                              # one-word difference (a changed punctuation mark) behind the move
ignore_repeated_headers = true  # a table header row repeated at the top of a continuation page is pagination
check_paragraphs = false      # report text starting a new paragraph / a line broken on purpose on one side only
                              # (prod "9. Filmmaker" / "Switches ..." on two lines, stage on one)
dehyphenate = true            # a word split by a hyphen at a line break is one word (line breaks are layout)
ignore_toc_page_numbers = true  # "Title ...... 17": page numbers shift whenever the layout differs
ignore_xref_page_numbers = true # `see "Title" on page 12.` vs `see "Title".`: the template's cross-reference format
ignore_tokens = ["•", "●", "■", "▪", "◦"]   # bullet glyphs are list styling
# Callout labels: "Tips" / "TIPS:", "Note" / "NOTE:", "Warning" / "WARNING:" are the same label (case,
# colon and plural are house style). Every occurrence of these words is compared this way.
# Empty list = compare labels strictly.
label_words = ["note", "tip", "hint", "warning", "important", "caution", "danger", "notice", "attention"]
# A note with only its icon (no label) means the label its icon stands for: a stage label that matches prod's
# icon is not "a label on one side only"; one that does not is "callout type differs" (icon kinds: callout_icons.py)
callout_icons = { pencil = ["note"], lightbulb = ["tip"], exclamation = ["important"], triangle = ["warning"] }
check_callout_icon_label = false  # icons are only compared for look, size, broken/missing and pixelation -
                                   # not for which callout label they imply
min_diff_words = 1
severity = "warning"          # individual text diffs (they are counted in the %)
spacing_severity = "warning"
reorder_severity = "info"     # identical text that only moved (e.g. table reading order)
reorder_min_words = 3         # a move is reported only from N words with letters: a lone callout number ("1"),
                              # symbol or short word read at another point is matched, not reported
ocr_images = true             # missing prod text is looked for inside the stage pictures (OCR, tesseract):
                              # figure labels / dimension callouts baked into the image are not missing
ocr_max_words = 60            # only for missing blocks up to this many words
ocr_dpi = 300
ocr_min_image_pt = 40         # pictures at least this wide (half as tall): not icons
graphic_text = true           # missing prod text that stage shows as a graphic (a figure badge "(A)" as an icon,
                              # a label drawn into a diagram) is found by its look: a CSS / layout finding, not missing data
graphic_text_max_words = 12   # only for missing pieces up to this many words
graphic_text_score = 0.72     # match needed (normalised cross-correlation of the rendered text, 0..1)
graphic_text_edge_score = 0.65  # ... and of the letter strokes at the hit: badge (A) is not badge (B)
graphic_text_severity = "warning"

[tables]
enabled = true
row_match_ratio = 0.5         # a prod table row is MISSING (critical) when < 50 % of its words are found in stage
missing_row_severity = "error"
extra_row_severity = "warning"
overflow_severity = "error"
check_cells = false           # report cells merged (fewer cells in stage) or split (more cells in stage) in mapped rows
validate_reordered_cells = true  # "Text in another order" inside a table: compare the data cell by cell - every
                              # cell the same (whatever its alignment / position) = not reported; else the
                              # cells that differ are reported as "Table cell differs"
cell_match_ratio = 0.6        # a prod table is the stage table of the same grid with >= this share of cells equal
cell_differs_severity = "error"
cells_severity = "warning"
check_borders = true          # every border of a prod table (outer edges, lines between rows / columns) must be drawn in stage
check_row_background = true   # rows shaded in prod (group rows between the data rows) must be shaded in stage, and the other way round
row_background_severity = "warning"
border_severity = "error"     # a prod table border missing in stage
border_color_tolerance = 150  # euclidean RGB distance: border colour differs (black -> light grey), not anti-aliasing
border_color_severity = "warning"   # text in a stage table that runs across its cell border (not in prod)
check_header_align = true     # stage table header cells (dark header bar): text centred in its column (design spec)
header_align_tolerance = 4.0  # pt the text may sit off the column centre
header_align_severity = "error"

[integrity]
glyphs = true                 # broken glyphs in stage (U+FFFD, private-use, NUL) -> critical
offpage = true                # text drawn outside the page -> critical
links = true                  # broken link targets -> critical; prod links missing in stage -> error
missing_link_severity = "error"
check_link_text_in_content = true  # verify "missing text" against link text on stage; suppress false positives
ignore_link_text_missing = true    # when missing prod text is found in stage links, suppress the finding

[toc]
# The printed table of contents is compared on its own: entries, levels (from indentation) and
# page numbers. Its text is excluded from the content check.
max_level = 0                 # validate TOC entries up to this level (1 = chapters, 2, 3 = sub-sections); 0 = all
validate_deeper_levels = true # an entry on a level prod's TOC does not list (stage: 3 or 4 levels, prod: 2) is checked
                              # against prod's heading of the same title: it exists, its level, order and page number
min_entries = 4               # a page is a TOC page when it has >= N "Title ...... 12" lines
max_front_fraction = 0.25     # ... and sits in the first 25 % of the document
title_match_threshold = 0.8   # fuzzy score to pair prod and stage entries

[toc.severity]
"level differs" = "warning"
"title differs" = "warning"
"missing entry" = "error"
"order differs" = "error"
"extra entry" = "warning"
"wrong page" = "error"

[style]
# Typography / CSS is validated on stage only, against the design spec (config/typography.toml):
# font family, weight, size, line height, colour, page size and margins. true = also report where
# stage's fonts differ from prod's (the prod -> stage style map).
compare_with_prod = false
check_emphasis = true         # report font-weight and italic differences of the running text (prod vs stage)
emphasis_any_weight = true    # every weight step (Regular -> Medium, Light -> Regular); false = bold vs plain only
properties = ["family", "weight", "italic", "size", "color"]
size_tolerance = 0.5          # pt
color_tolerance = 24          # euclidean RGB distance (0-441)
min_words = 1

[style.severity]              # per CSS property
font-family = "error"
font-size = "error"
font-weight = "error"
font-style = "error"
color = "warning"

[layout]
# Layout is validated on stage only (spec page size and margins, [typography]). true = also compare
# stage's layout with prod's: indent, alignment, line height, space above headings, bullet alignment,
# graphic placement and images outside their note box.
compare_with_prod = false
indent_tolerance = 4.0        # pt, relative to each document's content-box left edge
align_tolerance = 6.0         # pt, for left/center/right classification
line_height_tolerance_em = 0.3
heading_space_tolerance_em = 0.8
min_lines = 1
check_placement = true        # graphics: inline vs own line, and which word they follow (via text alignment)
ignore_center_placement = true  # a centred graphic only moving between inline and its own line (same
                              # neighbouring text both sides) is a reflow, not reported; a move next to
                              # different/missing text is still reported
check_wrap = false            # true = report the same text wrapping to the next line at a different word (line-wrap)
check_bullets = true          # bullet / numbered list markers (missing, different, numbering) - see list_marker
check_bullet_position = true  # bullet / numbered list ALIGNMENT (marker position, gap to the text, hanging
                              # indent): on - a mis-nested / wrongly indented item (e.g. "2." sitting under "1."'s
                              # text column instead of level with it) is a real layout defect, not just reflow
compare_bullets_with_prod = true  # bullet alignment (marker position, gap to the text, hanging indent) compared with
                              # prod even when compare_with_prod = false (also in tables and Note / Warning boxes);
                              # only takes effect when check_bullet_position = true
bullet_glued_em = 0.12        # a list number / bullet closer than this to its text (em) touches it: "15.12 V", "16.RS-232"
# a line's first word is a list marker when it is an enumerator (1. 2) a. (b) iv.) ...
# Roman numerals: i v x only ("(mm)" - millimetres - is not item 2000)
list_marker = '^\(?(?:\d{1,3}|[A-Za-z]|[ivxIVX]{1,4})[.)]$'
# ... or made only of characters of these Unicode categories: Po punctuation (• * ·), Pd dash (- –),
# So other symbol (▪ ✓ ➢). Math symbols (Sm: × + |) are not bullets.
list_symbol_categories = ["Po", "Pd", "So"]
ignore_bullet_glyph = true    # a list item marked "•" in one PDF and "-" (or another symbol) in the other: not reported
bullet_tolerance_em = 0.3     # marker position / marker-text gap / hanging indent may differ by this much (em)
bullet_intro_max_gap_em = 2.0 # the line introducing a list must be this close above it (em); a list with none
                              # (e.g. first list in a table cell) is checked for its items lining up with each other

[layout.severity]
text-align = "error"
indent = "warning"
line-height = "warning"
space-above = "warning"
placement = "warning"
line-wrap = "warning"

[assets]
blurred_ratio = 0.35          # stage picture blurred: its edge sharpness is below this share of prod's
blurred_severity = "error"
align_min_shift = 0.15        # image alignment: reported only when the picture's centre moves by >= 15 % of the text width
similar_image_severity = "warning"   # the same picture re-captured / re-cropped / without prod's highlight marks:
similar_picture_distance = 0.5       # an image difference (warning), not an error; above this visual distance
                                     # the stage picture is another picture: changed_severity (error)
mirrored_severity = "error"    # a matched picture flipped left-right or top-bottom in stage (a diagram's hash /
                               # pixel correlation tolerates this, so it would otherwise pass as unchanged)
mirrored_max_distance = 0.15   # only judged for a pair the hash already calls close (visual_distance below this)
mirrored_min_gap = 0.15        # flipped must correlate at least this much better than the direct match
tiny_label_pt = 5.0           # picture labels smaller than this (an IP address on a screenshot) count as drawn into the
                              # stage picture when its other labels are found there (too small to read back)
small_label_pt = 7.0          # all of a picture's labels smaller than this, and stage shows the same picture (a bitmap too
                              # coarse to read back, e.g. icon captions "0-40°C"): the labels are in that picture
combined_slice_score = 0.72   # a prod picture built from slices (an OSD menu cut in strips): once one slice is found in a
                              # stage picture, the next ones need this correlation inside it (red highlight frames lower it)
marks_severity = "warning"    # red highlight marks (outlines drawn over a screenshot) on one side only: a different image
marks_min_pixels = 20         # ... at least this many strong-red pixels on the picture drawn 400 px wide
marks_ratio = 0.3             # ... and the other side's picture has less than this share of them
marks_max_share = 0.1         # ... and they cover at most this share of the picture (a thin outline, not a red icon)
aspect_tolerance = 0.05       # 5 %
distorted_tolerance = 0.25    # stage draws a picture >= 25 % out of its own pixel proportions (prod does not)
                              # = stretched / squashed (genuine)
width_tolerance = 0.10        # 10 % of content width
size_ratio_tolerance = 0.2    # or stage picture >= 20 % smaller / bigger than prod (image size differs)
# The picture issues reported (every report): missing (or not loading), a different picture (not the same picture
# with / without a red overlay or re-captured: "image marks" / "image version" are not reported), blacked out,
# pixelated, distorted, duplicated, alignment (a complete move left <-> right only), a picture in the wrong section,
# a picture stage combined into a larger one (an info note), a picture's label missing (image report) and a stage
# picture measurably bigger or smaller than prod's (either direction). Everything else (placement, vector vs
# bitmap, extra pictures, order, ...) is not.
report_types = ["missing image", "broken image", "image changed", "image blacked out", "image pixelated",
                "image distorted", "duplicate image", "image alignment", "image in wrong section", "image combined",
                "missing image label", "image smaller", "image bigger", "image mirrored",
                "image vertical alignment",   # an icon centred on its paragraph in prod, at its first line in stage
                "extra image", "image order", "placement", "image outside box", "image blurred",   # a picture stage adds, pictures
                # in another order, a picture inline vs on its own line, out of its note / box, softer than prod's
                "icon missing inline", "icon differs", "icon pixelated",   # icons inside a sentence
                "callout numbers missing", "image label missing", "leader lines missing"]   # picture text: image report only
picture_text = false          # what is inside a picture is not compared: no text, table rows, callout numbers,
                              # labels or leader lines read from a picture (an embedded image, an illustration or a
                              # screenshot drawn as vectors) - only its red overlay (highlight marks) is checked.
                              # true = the picture's numbers / labels / leader lines go to the image report again
alignment_sides_only = true   # image alignment: only a complete move left <-> right (not centred / full width / indented)
pixelated_vs_vector = false   # "image pixelated" where prod draws the artwork as vectors and stage embeds a bitmap
                              # under pixelated_ppi: not reported (nothing of prod's to compare the resolution with).
                              # Pixelated = both are bitmaps, stage under pixelated_ppi and prod >= pixelated_ratio x
                              # sharper; a picture as coarse in prod as in stage is fine
ignore_prod_red_marks = false # prod's red highlight marks / red text on a picture that stage's copy does not have:
                              # false = shown in the image report only, as "Image overlay" (never "image differs"
                              # and never in the PDF report); true = not reported at all
count_severity = "error"
geometry_severity = "warning"
icon_max_width = 0.08         # images narrower than this share of the content width are icons
icons = "warning"             # small icons (< icon_max_width) missing / extra / broken / another colour: ignore | info | warning
margin_icons = "ignore"       # an icon in the margin beside a paragraph (prod's note / tip / safety icon): the callout
                              # template's icon, drawn its own way in the other PDF - not reported
match_window_words = 80       # how far (in aligned words) an image may drift and still pair
visual_match_threshold = 0.25 # max difference-hash distance (0-1) for "same picture"
same_spot_words = 12          # a different picture this close to the expected spot = replaced image
changed_severity = "error"    # a different picture at the same spot
same_picture_similarity = 0.8 # pixel correlation (-1..1) at or above which two pictures are the same picture
different_picture_similarity = 0.3  # ... below which a hash-paired picture is really a different one
picture_min_width = 0.15      # ... judged only for pictures at least this share of the content width (not logos)
blackout_fraction = 0.15      # share of a picture that is black in stage but not in prod -> blacked out
raster_vs_vector_severity = "info"  # same artwork, bitmap on one side and vector paths on the other
artwork_match_score = 0.6      # min cross-correlation when searching the other page for the same artwork
check_alignment = true        # report image alignment differences (left/right/center/full width)
ignore_center_alignment = true # suppress center alignment changes (only report left/right differences)

[report]
full_page_shots = true        # PDF report screenshots: the whole prod page and the whole stage page (not a crop)
max_locs = 40                 # highlight boxes per finding
max_findings_per_check = 0    # per check and section; 0 = no cap, every finding is reported (a cap only ever
                              # thins CSS / layout findings: critical and genuine issues are always kept)

[html]                        # web page (URL) as the candidate
crawl = true                  # validate every page of the guide: follow the start page's links to the other
                              # pages under the same folder, in reading order, joined into one document
max_pages = 0                 # stop after this many pages (0 = no limit)
concurrency = 6               # pages fetched at once (separate browser tabs) once the whole guide's page list is
                              # known from its left navigation (one page, one browser each - a tab is its own
                              # OS thread, so pages do not wait on each other's network round trip); 1 = one at a
                              # time, as before. Not used when the guide has no left navigation (its links are
                              # followed one page at a time as they are found)

# What a web page run reports - only these kinds of issue (a web guide is not validated like a stage PDF).
# [] = everything a PDF run reports.
report_types = [
  # content missing, extra or changed; a whole section missing / extra; content twice
  "missing text", "extra text", "changed text", "missing section", "extra section", "duplicate content",
  # links: not working, missing, going somewhere else
  "broken link", "missing link", "link to wrong section", "link target differs", "link lands elsewhere",
  # pictures: missing, broken, extra, another picture, size, alignment / placement
  "missing image", "broken image", "extra image", "image changed", "image smaller", "image bigger",
  "image alignment", "placement", "image outside box", "image distorted", "image order",
  # icons: missing, another icon, broken / low resolution, in text and in table rows
  "icon missing inline", "icon differs", "icon pixelated", "icon missing", "icon extra", "icon order", "icon above text",
  # tables: a table, header, row or cell missing, merged or split
  "missing table", "missing header", "missing row", "rows merged", "row split", "cells merged", "cells split",
  "tables merged", "cell differs",
  # layout structure: text stacked in prod set in columns (or the other way), items of a row not level
  "stacked to columns", "row alignment", "caption row",
  # a picture grid laid out differently; list numbers of one list not at one left edge; list markers
  "picture row", "list alignment", "bullet", "bullet marker", "numbering style", "numbering format", "numbering sequence",
]

[site]                        # web page runs: the chrome around the content (see pdfval/site_nav.py)
enabled = true                # left navigation vs the PDF's L1 TOC, its links, Download PDF, next / previous
                              # topic, "On this page", product subtitle
# CSS selectors, only when the labels ("Table of contents", "On this page", "Next topic", "Download PDF")
# do not find the element on a site; empty = found automatically
nav = ""                      # the left navigation (table of contents)
on_this_page = ""             # the right-hand list of the page's headings
on_this_page_max_level = 4    # every heading of the page down to this level (h2, h3, h4) must be in "On this page"
next = ""                     # the next-topic link
prev = ""                     # the previous-topic link
download = ""                 # the Download PDF link / button
header = ""                   # the header that holds the product title
subtitle = ""                 # the product title (subtitle) itself
footer = ""
breadcrumb = ""

[genuine]
report_image_labels = false       # labels / numbers / callout text in a picture (missing or drawn into it): not reported
report_visually_present = false   # text drawn into a stage picture (label in picture, text in image, text as graphic): the reader sees it - not reported
# The issues that mean something is really wrong in stage (the "genuine issues" report and
# `pdfval compare --genuine`): every issue type, including the TOC and the design-spec typography / layout.
# Only info notes stay out (still in the full report): text on another line, a callout label on one side
# only, raster vs vector artwork, a picture combined into a larger one, repeated "(continued)" headers.
# Content: every text difference counts - missing / extra / changed words, case, each punctuation
# mark, the space after a word (missing / extra / double space) and paragraph breaks.
# Bullets: a bullet point missing, added or changed, and bullet alignment (marker position, the gap
# to the text, hanging indent of wrapped lines).
types = [
  # content differences
  "missing text", "extra text", "changed text", "case", "punctuation", "case + punctuation", "spacing",
  "superscript", "paragraph break", "content in wrong section", "duplicate content",
  "missing section", "duplicate section", "extra section",
  "heading text",                           # the same section under a heading with other words / another number
  "emphasis",                                                        # bold / italic missing (or added)
  "label joined",                                                    # bold label + its plain text on one line (prod: 2 lines)
  # hyperlinks
  "broken link", "missing link", "extra link", "link to wrong section", "link target differs",
  "link lands elsewhere", "link page number", "page zero",   # “on page 0”: a cross-reference that did not resolve
  # lists: 1, 2, 3 instead of a, b, c, bullets missing / different
  "bullet", "bullet marker", "numbering style", "numbering format", "numbering sequence", "marker glued",
  # (not "indent" - bullet position / gap to the text / hanging indent: full report only)
  # images: blur, alignment, artwork missing, measurably bigger / smaller (not "missing image label": a picture's
  # label / caption missing is in the full report only)
  "image blurred", "image alignment", "placement", "missing image", "image smaller", "image bigger", "image vertical alignment",
  "broken image", "duplicate image", "image changed", "image blacked out", "image distorted", "image in wrong section", "image mirrored",
  "extra image", "image order", "image outside box",   # a picture only stage has, pictures in another order, out of its box
  # content order, hyperlink title quotes
  "reordered", "order differs", "link quotes",
  # table of contents: entries missing / added, title or level differs, wrong page number, the TOC's own heading
  "missing entry", "extra entry", "title differs", "level differs", "wrong page", "heading differs",
  "toc deeper levels",   # stage's TOC lists levels prod's does not: one entry, after each was checked against prod's headings
  # notes (callouts) that differ (not "callout style" - a document-wide bar/box redesign is house
  # style, not a defect: see [ignore] types)
  "icon missing", "icon extra", "icon order", "icon above text",   # icons in table rows (missing, swapped, placed above the text)   # a NOTE: label vs an icon only is house style (info, full report only)
  "callout type differs",   # stage labels a note as another type than prod's icon shows (WARNING icon, IMPORTANT label)
  "row alignment",   # side-by-side items of a prod row at different heights in stage
  "stacked to columns",   # a list broken into columns: text stacked in prod, side by side in stage
  "list alignment",       # the numbers of one numbered list at one left edge in prod, at different indents in stage
  "picture row",          # a picture grid laid out differently: side by side in prod, stacked in stage (or the reverse)
  # tables: header (missing / not centred as in prod), rows and cells merged or split
  "missing header", "rows merged", "row split", "cells merged", "cells split",
  "missing row", "missing table", "tables merged", "cell differs",
  "icon missing inline", "icon differs", "icon pixelated",   # icons inside a sentence: missing, another icon, low resolution
  "caption row",                            # captions of one row of pictures: level in prod, not in stage
  "missing image label",                    # a picture's caption / label missing in stage: live text that
                                             # belongs beside the picture, not drawn into it (not "label in
                                             # picture" / "text in image" - text drawn inside the picture itself,
                                             # still not reported: [genuine] report_image_labels / report_visually_present)
  "cell border",                            # a line between two cells of the prod table that stage does not draw
]
data_missing_words = 1        # "missing text" is genuine when >= N of its words are absent from stage (1 = any)
moved_min_words = 5           # content in the wrong section: blocks of >= N words ...
moved_overlap = 0.8           # ... whose words are >= 80 % the same as extra text in another section
everything = false            # true: every finding in the genuine report; false: only the types listed above
                              # (no CSS / design-spec typography, no heading structure, no info notes)
exclude_checks = []           # checks whose findings never go into the genuine report (still in the full
                              # report), e.g. ["toc"]. Empty: TOC issues are in the genuine report too

[ignore]
# Left out of the validation entirely (not in any report).
types = [
  "row background", "cell background",      # table interior background colours
  "link page number",                       # page numbers printed next to hyperlinks ("… on page 12")
  "repeated header", "continued header",    # table headers repeated across page breaks: expected
  "table width", "column width",            # table widths follow the DITA rendering rules
  "table border", "table border added",     # table layout: borders drawn by the template
  "spec table header", "spec table border", # table header bar / border colours
  "footer", "header", "spec page number",   # running footers / headers and their page numbers: not validated
  # CSS / layout: only spacing and indentation are validated (indent, bullet alignment, list level, spacing);
  # fonts, sizes, colours, line heights, alignment and the design-spec styling are not
  "font-size", "font-family", "font-weight", "font-style", "color", "line-height", "text-align", "space-above",
  "line-wrap",
  # (not "row alignment": items side by side on one row in prod - “1. Front Table” | “2. Rear Table” - that are
  # at different heights in stage are reported)
  "spec font-size", "spec font-family", "spec font-weight", "spec color", "spec line-height", "spec text-decoration",
  "spec text-align", "spec bullet", "spec list numbering", "spec callout title", "spec callout background",
  "spec callout content", "spec callout icon", "spec cover", "spec page margin", "spec page size", "spec pagination",
  "spec page structure",
  # images: text drawn into a picture is not reported (a picture softer than prod's - "image blurred" - is)
  "text as graphic",
  "size / aspect",                          # the same picture at another width / aspect ratio (1.43 -> 1.34): layout
  "superscript",                            # the same text raised / not raised (MacBook® vs MacBook^®): looks the same
  "case", "punctuation", "case + punctuation",  # uppercase/lowercase and punctuation-only wording differences
  "callout style",                          # a note drawn another way throughout (bar vs filled box): house style
  "order differs",                          # a section moved to another position: its content is still there
  "table header alignment",                 # a table header cell not centred: confirmed real (narrow / numeric
                                             # columns, e.g. "No.") but the site's own template issue, not
                                             # reported per table
]
in_table_cells = ["paragraph break", "line-wrap",   # text wrapping inside table cells
                  "emphasis", "indent", "text-align", "spec text-align"]  # table layout: header weight, alignment
in_callouts = ["indent", "text-align", "spec text-align"]  # indentation / alignment of Note, Warning, Important
sections = ['^q\s*(&|and)?\s*a index$', '^q\s*&\s*a$']      # Q&A index: its formatting is not validated
cover_pages = true            # an issue only on the first / last page of a PDF (cover, back cover: logos,
                              # copyright) is not reported; one that also has a spot on a content page stays
                              # (PDFs of 4+ pages: a shorter one has no cover)

[aem]
# AEM Guides source topics. A stage PDF published by AEM Guides names a destination after every
# topic's GUID, so each issue is traced to the topic (.dita file) it comes from and gets a link
# that opens that topic in AEM in a new tab.
enabled = true
author = "http://139.59.13.139:4502"   # AEM author URL (pre-filled in the UI; change it there or here)
user = ""                     # AEM user: with a password (UI, or env PDFVAL_AEM_PASSWORD) the tool asks AEM
                              # where each GUID's file is, so the link opens exactly that topic
search_root = "/content/dam/benq-aem-guides"   # where AEM is searched for the topic files
dam_root = "/content/dam/benq-aem-guides/en"   # {folder} when the product has no entry in [aem.products]
# The link. Placeholders: {author} {path} (topic file's DAM path: found in AEM, else {folder}/{guid}.dita)
# {folder} {guid} {lang} {map} {product} {element} {q} (URL-encoded GUID).
link = "{author}/libs/fmdita/clientlibs/xmleditor/page.html?src={path}&leftPanel=repository_panel&appMode=author"
# What a GUID link opens: "topic" = the topic file itself (found with the AEM login), else the map;
# "map" = always the product's map in the editor, with all of its topics
# (<product folder>/<maps_folder>/<map file from the stage PDF>, or where AEM has it when logged in).
open_in = "topic"
maps_folder = "Maps"
map_link = "{author}/libs/fmdita/clientlibs/xmleditor/page.html?src={path}&leftPanel=repository_panel&appMode=author"
# When neither is known: open the editor's Explorer, never a guessed file.
fallback_link = "{author}/libs/fmdita/clientlibs/xmleditor/page.html?leftPanel=repository_panel&appMode=author"

[aem.generate]
# Generate the stage PDF in AEM Guides (Native PDF) instead of uploading it: the map's output preset is
# chosen from where the map lives. The preset names must match the map console's Output tab exactly.
rules = [
  ["/Zowie/", "Zowie"],
  ["/Education/", "BenQ EDU With Image"],
  ["/INFTY", "INFTY"],
  ["/Business/", "BenQ With Image"],
  ["/Consumer/", "BenQ With Image"],
]
default_preset = "BenQ With Image"   # titles as in AEM's output presets; the tool looks up the preset's id by title
endpoint = "/bin/publishlistener"    # AEM Guides output generation (POST); params below, {map} / {preset} filled in
params = { operation = "GENERATEOUTPUT", source = "{map}", outputName = "{preset}" }   # {preset} = the preset id, {preset_title} = its title
output_root = ""                     # where the generated PDFs land ("" = the search root)
timeout_s = 300                      # wait at most 5 minutes for AEM to write the PDF
poll_s = 10

[aem.products]                # ditamap name (without .ditamap, exact or regex) = DAM folder of that product
# "sl04_and_sh04" = "/content/dam/benq-aem-guides/en/board/sl04-sh04"
"sl04_and_sh04" = "/content/dam/benq-aem-guides/en/Education/Signage/SL04-and-SH04"

[notes]
# Notes / callouts, prod against stage: the usual look of each note type (filled box and its colour, bar on the
# left, border). One finding per type when they differ. Notes without a title (icon only) are not read.
compare_style = true
compare_outliers = true       # also flag a single note whose look does not match its paired note, even when
                              # most notes of the type agree (an outlier the type-wide finding would miss)
min_notes = 2                 # compare a type only when both sides have at least this many titled notes
severity = "warning"

[ui]
stage_dir = ""                # batch pairs: the stage PDFs folder ("" = stage-pdf/ when it holds PDFs, else aem-map-pdfs/)
parallel_runs = 0             # comparisons run at the same time (each in its own process); 0 = auto: every CPU core but one

[footer]
enabled = false               # running header / footer (page numbers, footer text) prod vs stage: not validated
