# Typography and page layout of the user manual, from Figma:
#   "📄 Online User Manual" (file w2fNXjO8YfpQooXDJkuQxx)
#   - Topic Content Specification > Typography
#   - PDF (View) / PDF (Print) Output & Pagination Specification
# The stage PDF is validated against the format its page size matches (A4 = PDF View, A5 = PDF Print),
# in addition to the prod-vs-stage comparison. Merged over default.toml; override like any other key.

[typography]
enabled = true
format = "auto"               # auto (by the stage page size) | a4_view | a5_print
size_tolerance = 0.25         # pt
color_tolerance = 24          # euclidean RGB distance (0-441)
line_height_tolerance = 1.0   # pt, top-to-top distance of consecutive lines of one paragraph
margin_tolerance = 2.0        # pt
page_size_tolerance = 0.02    # share of width / height
table_note_gap = 40           # pt: small text this close below a table is its table note
severity = "warning"          # font family / weight / size / line height off the spec
layout_severity = "warning"   # page size, text inside the page margins
theme_tolerance = 40          # max RGB distance of the cover's colour from a theme's cover colour
cover_min_text = 28           # pt: a first page with text this large (the document title) is the cover
default_theme = "benq"        # the theme of a stage PDF without a cover page
align_tolerance = 6           # pt: a line this close to centred / right-aligned in the text column is not left-aligned

[typography.fonts]            # the Figma font roles -> the font family in the PDF
branding = "Poppins"
default = "Roboto"

[typography.weights]
Regular = 400
Medium = 500
Bold = 700

# Themes (Figma "PDF (View) Output & Pagination Specification > PDF (View) - Cover" and "Topic Pages"). The cover
# page's background names the theme. The theme sets the accent colour - "accent" in the styles below: Headline 1
# and Body Hyperlink (and its underline) - the colour of the cover text ("cover_text"; cover_colors overrides it per
# cover line) and the logos the cover carries (top-left | top-right | bottom-left | bottom-right | bottom-center).
# BenQ and BenQ Education as the template draws them (the Figma samples agree within a few RGB steps); ZOWIE and
# INFTY are sampled from the Figma thumbnails (no stage PDF of those themes yet): confirm them in Figma Inspect.
[typography.themes.benq]
label = "BenQ"
cover_background = "#482581"
accent = "#7231C6"
cover_text = "#FFFFFF"
logos = ["top-left"]

[typography.themes.edu]
label = "BenQ Education"
cover_background = "#008C94"
accent = "#00626B"
cover_text = "#FFFFFF"
logos = ["top-left", "bottom-right"]   # BenQ Education, chromebook

[typography.themes.zowie]
label = "ZOWIE"
cover_background = "#000000"
accent = "#BB2743"
cover_text = "#FFFFFF"
cover_colors = { optional = "#BB2743", subtitle = "#595959" }   # "Monitor for Esports" red, series grey
logos = ["top-left"]

[typography.themes.infty]
label = "INFTY"
cover_background = "#FFFFFF"
accent = "#000000"
cover_text = "#757575"
logos = ["bottom-center"]              # INFTYLAB

# Components (Figma "Online UM Stylesheet": 4. Lists, 6. Callout Component, 7. Table Component; the Topic Pages
# sample). The same in every format and theme.
[typography.components]
callout_titles = { important = "IMPORTANT", note = "NOTE", tip = "TIP", warning = "WARNING" }   # fixed, not editable
callout_backgrounds = { important = "#E3EAE3", note = "#DAE8F2", tip = "#F2F2F2", warning = "#F2DFDA" }
callout_icon_size = 14        # pt, the icon left of the callout title (± 3 pt)
table_header_background = "#333333"
table_border = "#DDDDDD"
bullets = "•●"                # unordered list: the default black circle
numbering = ["1, 2, 3", "a, b, c", "I, II, III"]   # ordered list levels 1-3; level 4 starts the cycle again

# Each style: font role, weight, size / line height (pt; px for html_web), text colour.
# Colours are measured from the Figma samples (Inspect needs a Figma login): black text, hyperlink purple
# (the theme's accent, see [typography.themes]), table note grey #757575, table header white on the dark header
# bar (Topic sample table), callout titles #333333 (Callout Component), and Headline 1 in the theme's accent as
# drawn in the "PDF (View) Layout" example (the web topic sample draws it black).
[typography.formats.a4_view]
label = "A4 PDF (View)"
page = [595.28, 841.89]
margins = { top = 24, bottom = 24, left = 24, right = 24 }
footer_gap = 12               # content area to page number
[typography.formats.a4_view.styles]
h1            = { font = "branding", weight = "Bold",    size = 20, line_height = 24, color = "accent" }
h2            = { font = "branding", weight = "Bold",    size = 14, line_height = 16, color = "#000000" }
h3            = { font = "branding", weight = "Bold",    size = 12, line_height = 16, color = "#000000" }
body_default  = { font = "default",  weight = "Regular", size = 12, line_height = 16, color = "#000000" }
body_strong   = { font = "default",  weight = "Bold",    size = 12, line_height = 16, color = "#000000" }
body_hyperlink = { font = "default", weight = "Regular", size = 12, line_height = 16, underline = true, color = "accent" }
table_header  = { font = "default",  weight = "Medium",  size = 12, line_height = 16, color = "#FFFFFF" }
table_default = { font = "default",  weight = "Regular", size = 12, line_height = 16, color = "#000000" }
table_note    = { font = "default",  weight = "Regular", size = 10, line_height = 12, color = "#757575" }
callout_title = { font = "default",  weight = "Bold",    size = 12, line_height = 16, color = "#333333" }
[typography.formats.a4_view.page_number]   # centred below the content, on every page after the cover
font = "default"
weight = "Regular"
size = 12
color = "#808080"
[typography.formats.a4_view.cover]         # Figma "PDF (View) - Cover": optional text / title / subtitle, version
title    = { font = "branding", weight = "Medium",  size = 36, color = "cover_text" }
optional = { font = "branding", weight = "Regular", size = 24, color = "cover_text" }
subtitle = { font = "branding", weight = "Regular", size = 16, color = "cover_text" }
version  = { font = "default",  weight = "Regular", size = 12, color = "cover_text" }

[typography.formats.a5_print]
label = "A5 PDF (Print)"
page = [419.53, 595.28]
margins = { top = 12, bottom = 12, left = 24, right = 24 }
footer_gap = 4
print = true                  # PDF (Print): no cover / Q&A index / TOC, the first page is page 1, version and title on page 1 only
[typography.formats.a5_print.styles]
h1            = { font = "branding", weight = "Bold",    size = 10, line_height = 10, color = "accent" }
h2            = { font = "branding", weight = "Bold",    size = 7,  line_height = 7, color = "#000000" }
h3            = { font = "branding", weight = "Bold",    size = 6,  line_height = 6, color = "#000000" }
body_default  = { font = "default",  weight = "Regular", size = 5,  line_height = 5, color = "#000000" }
body_strong   = { font = "default",  weight = "Bold",    size = 5,  line_height = 5, color = "#000000" }
body_hyperlink = { font = "default", weight = "Regular", size = 5,  line_height = 5, underline = true, color = "accent" }
table_header  = { font = "default",  weight = "Medium",  size = 5,  line_height = 5, color = "#FFFFFF" }
table_default = { font = "default",  weight = "Regular", size = 5,  line_height = 5, color = "#000000" }
table_note    = { font = "default",  weight = "Regular", size = 4,  line_height = 4, color = "#757575" }
callout_title = { font = "default",  weight = "Bold",    size = 5,  line_height = 5, color = "#333333" }

[typography.formats.html_web]   # for reference (web pages are checked by their CSS, not this spec)
label = "HTML Web"
unit = "px"
[typography.formats.html_web.styles]
h1            = { font = "branding", weight = "Bold",    size = 32, line_height = 40, color = "#000000" }
h2            = { font = "branding", weight = "Bold",    size = 28, line_height = 32, color = "#000000" }
h3            = { font = "branding", weight = "Bold",    size = 20, line_height = 24, color = "#000000" }
body_default  = { font = "default",  weight = "Regular", size = 16, line_height = 24, color = "#000000" }
body_strong   = { font = "default",  weight = "Bold",    size = 16, line_height = 24, color = "#000000" }
body_hyperlink = { font = "default", weight = "Regular", size = 16, line_height = 24, underline = true, color = "#7231C6" }
table_header  = { font = "default",  weight = "Medium",  size = 14, line_height = 16, color = "#FFFFFF" }
table_default = { font = "default",  weight = "Regular", size = 14, line_height = 16, color = "#000000" }
table_note    = { font = "default",  weight = "Regular", size = 12, line_height = 16, color = "#757575" }
# margin-top / margin-bottom of each heading role, and paragraph spacing (margin-bottom) - "0" means flush
# against whatever comes before/after it (H1 right under the breadcrumb, no extra air above/below it)
[typography.formats.html_web.heading_spacing]
h1 = { margin_top = 0,  margin_bottom = 0 }
h2 = { margin_top = 24, margin_bottom = 16 }
h3 = { margin_top = 16, margin_bottom = 8 }
p  = { margin_bottom = 16 }
# the vertical gap between two adjacent content blocks (not headings - see heading_spacing above),
# by the kind of block on each side - small/medium/large resolved via [sizes]
[typography.formats.html_web.block_gaps]
sizes = { small = 8, medium = 16, large = 20 }
rules = [
  { from = "paragraph", to = "paragraph", size = "medium" },
  { from = "paragraph", to = "table",     size = "medium" },
  { from = "paragraph", to = "image",     size = "medium" },
  { from = "paragraph", to = "callout",   size = "medium" },
  { from = "table",     to = "table",     size = "large" },
  { from = "table",     to = "image",     size = "large" },
  { from = "table",     to = "callout",   size = "large" },
  { from = "image",     to = "table",     size = "large" },
  { from = "image",     to = "image",     size = "large" },
  { from = "image",     to = "callout",   size = "large" },
  { from = "callout",   to = "table",     size = "large" },
  { from = "callout",   to = "image",     size = "large" },
  { from = "callout",   to = "callout",   size = "large" },
  { from = "table",     to = "paragraph", size = "large" },
  { from = "image",     to = "paragraph", size = "small" },
  { from = "callout",   to = "paragraph", size = "medium" },
]
