<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Parity</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --ink: #1b2130; --muted: #667085; --line: #e4e7ec; --soft: #f9fafb;
    --accent: #0f766e; --accent-ink: #fff; --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
    --fail: #d92d20; --warn: #b54708; --pass: #067647; --info: #475467;
    --c-structure: #2563eb; --c-content: #dc2626; --c-style: #7c3aed; --c-layout: #ea580c; --c-assets: #0d9488; --c-tables: #0284c7; --c-integrity: #b91c1c; --k-content: #dc2626; --k-images: #0d9488; --k-tables: #0284c7; --k-structure: #2563eb; --k-links: #b91c1c; --k-css: #7c3aed; --k-toc: #9333ea; --crit: #b42318;
    --radius: 10px; --shadow: 0 1px 2px rgb(16 24 40 / .06), 0 1px 3px rgb(16 24 40 / .08);
  }
  /* theme: light by default (same as the report viewer); dark when chosen, or when
     "System" is chosen and the OS is dark. The choice is remembered per browser. */
  :root[data-theme="dark"] { --bg: #0f1218; --panel: #171b23; --ink: #e6e8ec; --muted: #98a2b3; --line: #2a303b; --soft: #1d222c;
            --accent: #2dd4bf; --accent-ink: #042f2e; --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--bg)); --fail: #f97066; --warn: #fdb022; --pass: #47cd89; --info: #98a2b3;
            --shadow: none; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] { --bg: #0f1218; --panel: #171b23; --ink: #e6e8ec; --muted: #98a2b3; --line: #2a303b; --soft: #1d222c;
            --accent: #2dd4bf; --accent-ink: #042f2e; --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--bg)); --fail: #f97066; --warn: #fdb022; --pass: #47cd89; --info: #98a2b3;
            --shadow: none; }
  }
  /* a run's own page: the brand's accent instead of the tool's default teal (setBrandAccent()) */
  body[data-brand-accent] { --accent: var(--brand-accent); }
  .theme { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .theme button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px; padding: 0 24px; height: 56px;
               background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
  nav a { color: var(--muted); padding: 17px 2px; margin-right: 18px; border-bottom: 2px solid transparent; }
  nav a.on { color: var(--ink); border-bottom-color: var(--accent); text-decoration: none; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } main { padding: 16px; } }
  .btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: var(--soft); text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn.danger { color: var(--fail); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; cursor: pointer; transition: .15s; background: var(--soft); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { display: block; margin-bottom: 2px; }
  .picked { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); }
  .picked .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .or { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0; }
  select, input[type=text], input[type=password], input[type=number], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; }
  details summary { cursor: pointer; color: var(--muted); }
  .role { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .bar { height: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }

  .b-pass, .b-done { background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass); }
  .b-info, .b-queued, .b-running { background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .stat .k { font-size: 12px; color: var(--muted); } .stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 20px 0 14px; }
  .tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters input[type=text] { width: 240px; } .filters select { width: auto; max-width: 280px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .chip[aria-pressed=false] { opacity: .45; }
  .chip.opt[aria-pressed=false] { opacity: 1; }
  .chip.opt[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .cats button:last-child { border-right: 0; }
  .cats button[aria-selected=true] { background: var(--accent-soft); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }
  .cats .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .types { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }

  .crit { background: var(--crit); color: #fff; }
  .issue.is-crit { box-shadow: 0 0 0 2px color-mix(in srgb, var(--crit) 55%, transparent), var(--shadow); }
  .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pct.pass { color: var(--pass); } .pct.warn { color: var(--warn); } .pct.fail { color: var(--fail); }

  .meter i { display: block; height: 100%; }
  .stat.crit-card { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
  .issue { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .issue .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .issue .meta .sp { margin-left: auto; }
  .issue .msg { margin: 6px 0 10px; font-weight: 500; word-break: break-word; }
  /* a design-spec issue: what Figma sets and what stage has, one labelled row each */
  .msg .fs { display: flex; gap: 10px; margin-top: 4px; font-weight: 400; }
  .msg .fs b { flex: 0 0 46px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding-top: 2px; }
  .msg .fs b.fig { color: var(--c-style); }
  .msg .fs b.stg { color: var(--accent); }
  .msg .fs b.prd { color: var(--c-structure); }
  .msg .fgap { height: 10px; border-top: 1px dashed var(--line); margin-top: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .pair { grid-template-columns: 1fr; } .filters input[type=text] { width: 100%; } }
  figure { margin: 0; }
  figcaption { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
  .shot { width: 100%; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: #fff; display: block; min-height: 60px; }
  /* report picker: choose the issue types / severities / parts before downloading */
  dialog.rpt { border: 0; border-radius: 12px; padding: 0; width: min(960px, 96vw); max-height: 90vh; background: var(--panel); color: var(--ink); box-shadow: 0 24px 64px rgb(0 0 0 / .3); }
  dialog.rpt::backdrop { background: rgb(10 12 16 / .55); }

  .rpt .rh { border-bottom: 1px solid var(--line); } .rpt .rh h2 { margin: 0; font-size: 17px; flex: 1; }

  .rpt legend { padding: 0 4px; font-weight: 700; }
  .rpt legend label { font-size: 14px; }
  .rpt .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 3px 16px; margin-top: 4px; }
  .rpt label { display: flex; gap: 7px; align-items: center; font-size: 13px; cursor: pointer; }
  .rpt .n { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .rpt .row { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .rpt .muted { color: var(--muted); font-size: 12px; }
  .rpt select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .lightbox { position: fixed; inset: 0; background: rgb(10 12 16 / .96); z-index: 20; display: flex; flex-direction: column; padding: 18px; gap: 12px; }
  .lightbox .lb-head { color: #fff; display: flex; gap: 12px; align-items: center; }
  .lightbox .lb-head .msg { flex: 1; }
  .lightbox .btn { color: var(--ink); }
  .lightbox .lb-body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
  .lightbox figure { overflow: auto; background: #fff; border-radius: 8px; padding: 8px; }
  .lightbox figure img { width: 100%; }
  .lightbox figcaption { color: #333; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .err { color: var(--fail); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .guid { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 8px;
          border-radius: 6px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); color: var(--ink); white-space: nowrap; cursor: pointer; }
  a.guid:hover { border-color: var(--accent); text-decoration: none; } button.guid { cursor: copy; }
  .guid.off { background: var(--soft); border-color: var(--line); color: var(--muted); }
  .src { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; font-size: 13px; }
  .src .k { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .aemcfg { display: grid; grid-template-columns: 1.2fr 1.2fr; gap: 12px; }
  .aemcfg .wide { grid-column: 1 / -1; }
  @media (max-width: 800px) { .aemcfg { grid-template-columns: 1fr; } }

  body.wide main { max-width: none; padding: 18px 24px; }
  .rhead { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .rtitle { flex: 1; min-width: 280px; } .rtitle h1 { margin: 2px 0; }
  .ractions { display: flex; gap: 8px; align-items: center; }
  details.more { position: relative; } details.more summary { list-style: none; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more .menu { position: absolute; right: 0; top: 110%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); z-index: 6; min-width: 180px; padding: 6px; }
  details.more .menu a { display: block; padding: 7px 10px; border-radius: 6px; color: var(--ink); }
  details.more .menu a:hover { background: var(--soft); text-decoration: none; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0 4px; }
  .kpis.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .sitegroups { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .sitegroups button { text-align: left; display: grid; gap: 4px; border: 1px solid var(--line); border-left: 4px solid var(--pass); border-radius: 8px; background: var(--panel); padding: 10px 12px; cursor: pointer; color: inherit; font: inherit; }
  .sitegroups button.s-warn { border-left-color: var(--warn); } .sitegroups button.s-fail { border-left-color: var(--fail); }
  .sitegroups button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }
  .sitegroups .n { font-size: 12px; color: var(--muted); }
  table.t.site td { vertical-align: top; font-size: 13px; overflow-wrap: anywhere; } table.t.site td.st { width: 70px; white-space: nowrap; }
  table.t.site code { font-size: 11px; color: var(--muted); }
  @media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 2px; text-align: left; font: inherit; color: inherit; }
  button.kpi { cursor: pointer; } button.kpi:hover { border-color: var(--accent); }
  .kpi.is-crit { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
  .kpi .k { font-size: 12px; color: var(--muted); } .kpi .pct, .kpi .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 12px; color: var(--muted); } .kpi .badge { justify-self: start; font-size: 14px; }
  .workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } .side { position: static !important; max-height: none !important; } }
  .side { position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 12px; align-content: start; }
  .side input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .sgroup { display: grid; gap: 2px; }
  .sh { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 2px 0 4px; display: flex; justify-content: space-between; }
  .sh a { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; padding: 6px 8px; border-radius: 7px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .nav:hover { background: var(--soft); } .nav.on { background: var(--accent-soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  .nav .n, .chk .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

  .seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  @media (max-width: 1100px) { .keys { display: none; } }
  .ghead { display: flex; gap: 10px; align-items: center; padding: 14px 6px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 104px; background: var(--bg); z-index: 2; }

  .st-fail { background: var(--fail); } .st-warn { background: var(--warn); } .st-pass { background: var(--pass); }

<script>
const $ = (s, r = document) => r.querySelector(s);
(function themeSwitch() {
  const mark = () => document.querySelectorAll('[data-theme-set]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.themeSet === document.documentElement.dataset.theme));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => {
    document.documentElement.dataset.theme = b.dataset.themeSet;
    try { localStorage.setItem('pdfval-theme', b.dataset.themeSet); } catch (e) {}
    mark();
  });
  mark();
})();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHECKS = ['structure', 'content', 'tables', 'assets', 'integrity', 'style', 'layout'];
const CATS = [['content', 'Content'], ['images', 'Images'], ['tables', 'Tables'], ['toc', 'TOC'], ['structure', 'Structure'],
              ['links', 'Links & rendering'], ['css', 'CSS / layout']];
const CAT_LABEL = Object.fromEntries(CATS);
const SEVS = ['error', 'warning', 'info'];
const app = $('#app');
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB';
const fmtDate = s => new Date(s).toLocaleString();
let poll = null;

// ---------------- router
async function route() {
  clearTimeout(poll);
  document.body.classList.remove('wide');
  document.onkeydown = null;
  const [path, qs] = location.hash.split('?');
  const [, view, id] = path.split('/');
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === (view || 'new') || (view === 'run' && a.dataset.nav === 'runs')));
  if (view !== 'run') clearBrandAccent();  // only a run's own page wears its brand's colour
  if (view === 'runs') return viewRuns();
  if (view === 'metadata') return viewMetadata();
  if (view === 'pairs') return viewPairs();
  if (view === 'run' && id) return viewRun(id, qs);
  return viewNew(qs);
}

// ---------------- brand accent: a run's page uses its product's brand colour (config/typography.toml
// [typography.themes]) instead of the tool's own teal - ZOWIE red, BenQ purple, etc. The brand is guessed
// from the run's name / file paths (no reliable cover-page theme detection for a web-page candidate).
let _themes = null;
async function _loadThemes() {
  if (!_themes) { try { _themes = await api('/api/themes'); } catch (e) { _themes = {}; } }
  return _themes;
}
const _BRAND_HINTS = [[/zowie/i, 'zowie'], [/\beducation\b|\bedu\b/i, 'edu'], [/infty/i, 'infty']];
function clearBrandAccent() {
  document.body.removeAttribute('data-brand-accent');
  document.body.style.removeProperty('--brand-accent');
}
async function setBrandAccent(job) {
  const text = [job.name, job.baseline, job.candidate].filter(Boolean).join(' ');
  const hit = _BRAND_HINTS.find(([re]) => re.test(text));
  const key = hit ? hit[1] : 'benq';  // the default theme (config/typography.toml default_theme)
  const themes = await _loadThemes();
  const accent = themes[key]?.accent;
  if (!accent || !location.hash.startsWith(`#/run/${job.id}`)) return;  // stale response from a since-left run
  document.body.style.setProperty('--brand-accent', accent);
  document.body.setAttribute('data-brand-accent', key);
}
addEventListener('hashchange', route);

// ---------------- prod ⇄ stage pairs: every stage PDF (aem-map-pdfs) with its prod PDF (prod library), run as a batch
function viewPairs() { return pairsPanel(app, false); }

async function pairsPanel(root, embedded) {
  root.innerHTML = '<p class="muted">Loading matched publications…</p>';
  let d;
  try { d = await api('/api/pairs'); } catch (e) { root.innerHTML = ''; return; }
  if (!root.isConnected) return;
  if (!d.stage.length) { root.innerHTML = embedded ? '' : '<p class="muted">No stage PDFs yet: download the AEM map PDFs first (python -m pdfval aem-pdfs).</p>'; return; }
  const label = f => `${f.group}/${f.product}${f.sub ? '/' + f.sub : ''}/${f.name}`;
  const byLabel = new Map(d.prod.map(f => [label(f), f.path]));
  const byPath = new Map(d.prod.map(f => [f.path, label(f)]));
  const langs = [...new Set(d.stage.map(s => s.lang))];
  const P = { q: '', lang: langs.includes('en') ? 'en' : '', only: '' };
  d.stage.forEach((s, k) => { s.k = k; s.on = false; });  // nothing ticked: the user picks what to test
  const $ = sel => root.querySelector(sel);
  root.innerHTML = `<div class="row">${embedded ? '<div><div class="role">Batch · prod ⇄ stage</div><h2 style="margin-top:4px">Matched publications</h2></div>' : '<h1>Prod ⇄ Stage pairs</h1>'}<span class="spacer"></span>
      <span class="small muted" id="pr-count"></span><button class="btn primary" id="pr-run">Validate selected</button></div>
    ${embedded ? '<p class="small muted" style="margin:4px 0 10px">Each stage PDF (AEM map) with its matched prod PDF. Tick the ones to test and press <b>Validate selected</b> — they run with the options below and appear on the Runs page.</p>' : ''}
    <p class="muted" ${embedded ? 'hidden' : ''}>Stage = the PDFs generated from the AEM maps (<code>${esc(d.stage_dir)}</code>), prod = the prod library.
      Each stage map is paired with its prod PDF through the migration Excel (model row → file = prod archive), else by name.
      Change any prod PDF by typing in its box; tick the pairs to compare and run them – they queue on the Runs page.</p>
    <div ${embedded ? '' : 'class="card"'}><div class="row" style="gap:8px;flex-wrap:wrap">
      <select id="pr-lang" style="width:auto;flex:0 0 auto"><option value="">All languages</option>${langs.map(l => `<option ${l === P.lang ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <select id="pr-only" style="width:auto;flex:0 0 auto"><option value="">All pairs</option><option value="paired">Paired</option><option value="unpaired">No prod PDF</option></select>
      <input type="search" id="pr-q" placeholder="Search product, folder or file…" style="flex:1 1 220px;width:auto">
      <button class="btn sm" id="pr-all">Tick all shown</button><button class="btn sm" id="pr-none">Untick all shown</button></div></div>
    <datalist id="pr-prod">${d.prod.map(f => `<option value="${esc(label(f))}">`).join('')}</datalist>
    <div style="overflow:auto;max-height:${embedded ? '380px' : '70vh'};margin-top:10px;border:1px solid var(--line, #ddd);border-radius:8px">
      <table class="t" style="margin:0"><thead style="position:sticky;top:0;z-index:1;background:var(--card, #fff)"><tr><th></th><th>Stage (AEM map PDF)</th>
      <th>Prod PDF</th><th>Paired by</th></tr></thead><tbody id="pr-body"></tbody></table></div>`;
  const shown = () => d.stage.filter(s => (!P.lang || s.lang === P.lang) && (!P.only || (P.only === 'paired') === !!s.prod) &&
    (!P.q || `${s.folder}/${s.name} ${byPath.get(s.prod) || ''}`.toLowerCase().includes(P.q)));
  const count = () => { const n = d.stage.filter(s => s.on && s.prod).length; $('#pr-count').textContent = `${n} pair(s) selected`; $('#pr-run').disabled = !n; };
  const draw = () => {
    $('#pr-body').innerHTML = shown().map(s => `<tr data-k="${s.k}">
      <td><input type="checkbox" data-on ${s.on && s.prod ? 'checked' : ''} ${s.prod ? '' : 'disabled'}></td>
      <td><b>${esc(s.product)}</b> <span class="badge">${esc(s.lang)}</span><div class="small muted">${esc(s.folder)}/${esc(s.name)}</div></td>
      <td style="min-width:340px"><input list="pr-prod" data-prod value="${esc(byPath.get(s.prod) || '')}" placeholder="— pick the prod PDF —" style="width:100%"></td>
      <td>${s.via ? `<span class="badge ${s.via === 'Excel' ? 'b-pass' : 'b-warn'}">${esc(s.via)}</span>` : '<span class="badge b-fail">none</span>'}</td></tr>`).join('');
    count();
  };
  $('#pr-body').onchange = e => {
    const s = d.stage[+e.target.closest('tr').dataset.k];
    if (e.target.matches('[data-on]')) s.on = e.target.checked;
    if (e.target.matches('[data-prod]')) {
      const path = byLabel.get(e.target.value.trim()) || '';
      s.prod = path; s.on = !!path; s.via = path ? 'manual' : '';
      draw();
    }
    count();
  };
  $('#pr-lang').onchange = e => { P.lang = e.target.value; draw(); };
  $('#pr-only').onchange = e => { P.only = e.target.value; draw(); };
  $('#pr-q').oninput = e => { P.q = e.target.value.toLowerCase(); draw(); };
  $('#pr-all').onclick = () => { shown().forEach(s => s.on = !!s.prod); draw(); };
  $('#pr-none').onclick = () => { shown().forEach(s => s.on = false); draw(); };
  $('#pr-run').onclick = async () => {
    const pairs = d.stage.filter(s => s.on && s.prod).map(s => ({ baseline: s.prod, candidate: s.path, name: `${s.product} (${s.lang})` }));
    const options = { mode: 'pdf', screenshots: 'all' };
    if (embedded) document.querySelectorAll('[id^="o-"]').forEach(el => options[el.id.slice(2)] = el.type === 'checkbox' ? el.checked : el.value);

    $('#pr-run').disabled = true;

  $('#ur-file').onchange = () => {

    const options = { mode: 'html' };
    document.querySelectorAll('[id^="o-"]').forEach(el => options[el.id.slice(2)] = el.type === 'checkbox' ? el.checked : el.value);
    const concurrent = Math.max(1, +$('#ur-conc').value || 6);
    if (!pairs.length || !confirm(`Queue ${pairs.length} prod ⇄ web page comparison(s)? ${Math.min(concurrent, pairs.length)} run at a time, the rest queue behind them.`)) return;
    $('#ur-run').disabled = true;
    try { await api('/api/pairs/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pairs, options, concurrent }) });
          location.hash = '#/runs'; }
    catch (e) { alert(e.message); $('#ur-run').disabled = false; }
  };
}

  // restore the previous run's general options
  Object.entries(o).forEach(([k, v]) => {
    const el = document.getElementById('o-' + k);
    if (!el || k.startsWith('html_')) return;
    el.type === 'checkbox' ? (el.checked = !!v) : (el.value = v);

  try { files = await api('/api/files'); } catch (e) { /* listing is optional */ }

  const isStage = f => /(^|\/)stag/i.test(f.folder), isProd = f => /(^|\/)prod/i.test(f.folder);
  renderSlot('baseline', files.filter(f => !isStage(f)));

    // the prod PDF of the guide, found from its URL (product / language -> the prod library, as PDF ⇄ PDF pairs do):
    // filled in while no prod PDF is picked by hand; "Change" in the prod card takes over
    let seq = 0, timer = null;
    const autoProd = async () => {
      const url = $('#url')?.value.trim() || '';
      if (!/^https?:\/\/\S+$/.test(url) || (pick.baseline && !pick.baseline.auto)) return;
      const n = ++seq;
      let r = null;
      try { r = await api('/api/prod-for?url=' + encodeURIComponent(url)); } catch (e) { return; }
      if (n !== seq || !$('#url') || (pick.baseline && !pick.baseline.auto)) return;
      const note = $('#auto-prod-note') || (() => { const d = document.createElement('div'); d.id = 'auto-prod-note'; d.className = 'small';
        d.style.marginTop = '8px'; $('#card-baseline').appendChild(d); return d; })();
      if (r && r.prod) {
        pick.baseline = { path: r.prod, name: r.name, size: r.size, auto: true };
        renderSlot('baseline', files.filter(f => !isStage(f)));
        note.className = 'small';
        note.innerHTML = `<b style="color:#15803d">✓ Prod PDF found automatically</b> for <b>${esc(r.product)}</b>${r.lang ? ' (' + esc(r.lang) + ')' : ''}`
          + ` — via ${r.via === 'Excel' ? 'the migration Excel' + (r.model ? ' (model ' + esc(r.model) + ')' : '') : 'its name in the prod library'}. “Change” picks another.`;
      } else {
        if (pick.baseline?.auto) { pick.baseline = null; renderSlot('baseline', files.filter(f => !isStage(f))); }
        note.className = 'small muted';
        note.textContent = r && r.product ? `No prod PDF found for “${r.product}” in the prod library — pick it above.` : '';
      }
      updateGo();
    };
    $('#url').oninput = () => { updateGo(); clearTimeout(timer); timer = setTimeout(autoProd, 450); };
    autoProd();
  }
  $('#go').onclick = start;
  if ($('#pairs-panel')) pairsPanel($('#pairs-panel'), true);
  if ($('#urls-panel')) urlsPanel($('#urls-panel'));
  $('#aem-check').onclick = () => aemLogin(true);
  if ($('#aem-stage-go')) {
    const info = () => $('#aem-map-info');
    $('#aem-map-check').onclick = async () => {  // which map and preset, and a link to open the map in AEM
      info().textContent = 'Looking up the map in AEM…';
      try {
        const r = await api('/api/aem/preset', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify({ map: $('#aem-map').value.trim() }) });
        info().innerHTML = `Map <b>${esc(r.map_path)}</b> → template <b>${esc(r.preset)}</b>` +
          (r.open ? ` · <a href="${esc(r.open)}" target="_blank" rel="noopener">Open map in AEM ↗</a>` : '');
      } catch (e) { info().textContent = e.message; }
    };
    $('#aem-stage-go').onclick = async () => {  // find the map, generate the stage PDF in AEM, put it in the stage slot
      const btn = $('#aem-stage-go');
      if (!pick.baseline) { info().textContent = 'Pick the prod PDF first: its file name tells which map to generate.'; return; }
      btn.disabled = true;
      try {
        if (!(await aemLogin(false))) throw new Error('Log in to AEM first (AEM login card below).');
        if (!pick.baseline.path) pick.baseline = { ...pick.baseline, path: await upload(pick.baseline.file, 'prod') };
        let t = await api('/api/aem/stage', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify({ baseline: pick.baseline.path, map: $('#aem-map').value.trim() }) });
        while (t.state === 'running') {
          info().textContent = '⏳ ' + t.message + (t.preset ? ` · template ${t.preset}` : '');
          await new Promise(r => setTimeout(r, 3000));
          t = await api('/api/aem/stage/' + t.id);
        }
        if (t.state !== 'done') throw new Error(t.message);
        pick.candidate = { path: t.path, name: t.name };
        renderSlot('candidate', []); updateGo();
        info().innerHTML = `✓ ${esc(t.message)} · map <b>${esc(t.map)}</b>`;
      } catch (e) { info().textContent = '✗ ' + e.message; }
      btn.disabled = false;
    };
  }
  updateGo();
  aemLoad();
}

// ---------------- AEM login before the run: the run looks up each GUID's topic file with it
let AEM = { author: '', has_password: false, user: '', ok: false };
async function aemLoad() {
  try { AEM = { ...AEM, ...(await api('/api/aem')) }; } catch (e) { return; }
  if (!$('#aem-card')) return;
  $('#n-aem-user').value = AEM.user || '';
  $('#n-aem-author').value = AEM.author || '';
  AEM.ok = !!AEM.has_password;
  aemShow(AEM.ok ? `ready — logged in as ${AEM.user}` : (AEM.author ? 'not logged in' : 'no AEM author URL set'), AEM.ok ? 'pass' : 'warn');
}
function aemShow(text, cls) {
  const el = $('#aem-state');
  if (el) el.innerHTML = `<span class="badge b-${cls}">${esc(text)}</span>`;
}
async function aemLogin(explicit) {
  const user = $('#n-aem-user').value.trim(), password = $('#n-aem-pass').value;
  const author = $('#n-aem-author').value.trim().replace(/\/+$/, '');
  const msg = $('#aem-msg');
  if (!explicit && AEM.ok && !password && user === AEM.user && author === AEM.author) return true;  // already logged in this session
  msg.classList.remove('err'); msg.textContent = 'Checking with AEM…';
  const r = await api('/api/aem/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify({ author, user, password }) });
  msg.textContent = r.message; msg.classList.toggle('err', !r.ok);
  AEM.author = r.author || author;
  AEM.ok = r.ok; if (r.ok) { AEM.user = r.user; AEM.has_password = true; $('#n-aem-pass').value = ''; }
  aemShow(r.ok ? `ready — logged in as ${r.user}` : 'not logged in', r.ok ? 'pass' : 'fail');
  return r.ok;
}

function renderSlot(side, files) {
  const slot = $(`#card-${side} .slot`);
  if (!slot) return;
  const p = pick[side];
  if (p) {
    slot.innerHTML = `<div class="picked"><span>📄</span><span class="name" title="${esc(p.path || p.name)}">${esc(p.name)}</span>
      <span class="muted small">${p.size ? fmtSize(p.size) : ''}</span><button class="btn sm" data-clear>Change</button></div>
      ${p.path ? `<div class="small muted" style="margin-top:6px;word-break:break-all">${esc(p.path)}</div>` : '<div class="small muted" style="margin-top:6px">Will be uploaded when the run starts</div>'}`;
    slot.querySelector('[data-clear]').onclick = () => { pick[side] = null; renderSlot(side, files); updateGo(); };
  } else {
    const guess = files.find(f => new RegExp(side === 'baseline' ? 'prod' : 'stag', 'i').test(f.folder + '/' + f.name));
    slot.innerHTML = `<div class="drop" tabindex="0"><b>Drop a PDF here</b><span class="muted small">or click to browse</span>
        <input type="file" accept="application/pdf,.pdf" hidden></div>
      ${files.length ? `<div class="or">or choose an existing file</div>
        <select><option value="">— select from ${files.length} PDF(s) on disk —</option>
        ${files.map(f => `<option value="${esc(f.path)}" ${guess === f ? 'data-guess' : ''}>${esc(f.folder)}/${esc(f.name)} (${fmtSize(f.size)})</option>`).join('')}</select>
        ${guess ? `<div class="small" style="margin-top:6px">Suggestion: <a href="#" data-guess>${esc(guess.folder)}/${esc(guess.name)}</a></div>` : ''}` : ''}`;
    const drop = slot.querySelector('.drop'), input = drop.querySelector('input');
    const take = f => { if (f) { pick[side] = { file: f, name: f.name, size: f.size }; renderSlot(side, files); updateGo(); } };
    drop.onclick = () => input.click();
    drop.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && input.click();
    input.onchange = () => take(input.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files[0]); };
    const sel = slot.querySelector('select');
    const choose = path => { const f = files.find(x => x.path === path); if (f) { pick[side] = { path: f.path, name: f.name, size: f.size }; renderSlot(side, files); updateGo(); } };
    if (sel) sel.onchange = () => choose(sel.value);
    slot.querySelector('a[data-guess]')?.addEventListener('click', e => { e.preventDefault(); choose(guess.path); });
    if (side === 'baseline') renderLibrary(slot, f => { pick.baseline = { path: f.path, name: f.name, size: f.size }; renderSlot(side, files); updateGo(); });
  }
}

// ---------------- Prod library: PDFs extracted from the pdf-prod archives, by folder + search
let LIB = null;
async function renderLibrary(slot, onPick) {
  const box = document.createElement('div');
  box.className = 'lib';
  box.innerHTML = `<div class="or">or pick from the prod library (pdf-prod archives)</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><select data-group style="flex:0 0 auto;width:auto"></select>
      <select data-product style="flex:1 1 140px;width:auto"></select>
      <input type="search" data-q placeholder="Search PDF name…" style="flex:1 1 160px"></div>
    <div data-list style="max-height:240px;overflow:auto;margin-top:6px;border:1px solid var(--line,#ddd);border-radius:6px"></div>
    <div class="small muted" data-lstat style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>`;
  slot.appendChild(box);
  const g = box.querySelector('[data-group]'), pr = box.querySelector('[data-product]'), q = box.querySelector('[data-q]');
  const list = box.querySelector('[data-list]'), stat = box.querySelector('[data-lstat]');
  const draw = () => {
    const files = LIB?.files || [];
    const groups = [...new Set(files.map(f => f.group))];
    const gv = g.value;
    g.innerHTML = `<option value="">All folders</option>` + groups.map(x => `<option ${x === gv ? 'selected' : ''}>${esc(x)}</option>`).join('');
    const inGroup = files.filter(f => !g.value || f.group === g.value);
    const pv = pr.value, prods = [...new Set(inGroup.map(f => f.product))];
    pr.innerHTML = `<option value="">All products (${prods.length})</option>` + prods.map(x => `<option ${x === pv ? 'selected' : ''}>${esc(x)}</option>`).join('');
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const shown = inGroup.filter(f => (!pr.value || f.product === pr.value) &&
      terms.every(t => `${f.product}/${f.sub}/${f.name}`.toLowerCase().includes(t)));
    list.innerHTML = shown.length ? shown.slice(0, 300).map((f, i) => `<button type="button" data-i="${i}" title="${esc(f.path)}"
        style="display:flex;width:100%;gap:8px;text-align:left;padding:6px 8px;border:0;border-bottom:1px solid var(--line,#eee);background:none;cursor:pointer;color:inherit">
        <span>📄</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis"><b>${esc(f.name)}</b>
        <span class="muted small"> · ${esc(f.group)}/${esc(f.product)}${f.sub ? '/' + esc(f.sub) : ''}</span></span>
        <span class="muted small">${fmtSize(f.size)}</span></button>`).join('')
      : `<div class="small muted" style="padding:8px">${files.length ? 'No PDF matches.' : 'No PDFs extracted yet.'}</div>`;
    list.querySelectorAll('[data-i]').forEach(b => b.onclick = () => onPick(shown[+b.dataset.i]));
    stat.innerHTML = `<span>${shown.length} of ${files.length} PDF(s)${shown.length > 300 ? ' (first 300 shown)' : ''}</span>` +
      (LIB?.running ? `<span>Extracting ${LIB.done}/${LIB.total}: ${esc(LIB.current)}…</span>`
        : LIB?.pending ? `<button class="btn sm" type="button" data-x>Extract PDFs from ${LIB.pending} archive(s)</button>` : '') +
      (LIB?.errors?.length ? `<span class="err" title="${esc(LIB.errors.join('\n'))}">${LIB.errors.length} failed</span>` : '');
    stat.querySelector('[data-x]')?.addEventListener('click', async () => {
      try { LIB = { ...LIB, ...(await api('/api/library/extract', { method: 'POST' })) }; draw(); poll(); }
      catch (e) { alert(e.message); }
    });
  };
  const poll = async () => {
    if (!box.isConnected) return;
    LIB = await api('/api/library'); draw();
    if (LIB.running) setTimeout(poll, 1500);
  };
  g.onchange = () => { pr.value = ''; draw(); };
  pr.onchange = draw; q.oninput = draw;
  if (LIB) draw();
  poll();
}

function updateGo() {
  const url = $('#url')?.value.trim() || '';
  $('#go').disabled = !(pick.baseline && (MODE === 'pdf' ? pick.candidate : /^https?:\/\/\S+$/.test(url)));
}

function upload(file, label) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
    x.upload.onprogress = e => $('#go-status').textContent = `Uploading ${label}… ${Math.round(100 * e.loaded / e.total)}%`;
    x.onload = () => x.status < 300 ? resolve(JSON.parse(x.responseText).path) : reject(new Error(JSON.parse(x.responseText).error));
    x.onerror = () => reject(new Error('upload failed'));
    x.send(file);
  });
}

async function start() {
  const go = $('#go'), st = $('#go-status');
  go.disabled = true; st.classList.remove('err');
  try {
    // an AEM login only resolves GUIDs to their topic file (nicer links in the report) - optional, and
    // never a reason to block the comparison itself: a failed/declined login just runs without those links
    if (MODE === 'pdf' && (AEM.author || $('#n-aem-author').value.trim())) {
      const typed = $('#n-aem-user').value.trim() || $('#n-aem-pass').value;
      if (typed || AEM.ok) {
        if (!(await aemLogin(false))) st.textContent = 'AEM login failed — running without links to the topic files.';
      }
    }
    const paths = {};
    paths.baseline = pick.baseline.path || await upload(pick.baseline.file, 'prod');
    paths.candidate = MODE === 'html' ? $('#url').value.trim() : (pick.candidate.path || await upload(pick.candidate.file, 'stage'));
    const options = { mode: MODE };
    document.querySelectorAll('[id^="o-"]').forEach(el => options[el.id.slice(2)] = el.type === 'checkbox' ? el.checked : el.value);
    const job = await api('/api/runs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...paths, name: $('#run-name').value.trim(), options }) });
    pick.baseline = pick.candidate = null;
    location.hash = '#/run/' + job.id;
  } catch (e) {
    st.textContent = e.message; st.classList.add('err'); go.disabled = false;
  }
}

       title="Every product with its PDF validation and its AEM site validation side by side, from the newest run of each kind">🔗 Combined report (PDF + AEM site)</a>
    <a class="btn sm" href="/api/combined.csv" title="The same as a spreadsheet">CSV</a></div>`;

  app.innerHTML = combined + `<div class="row"><h1>Runs</h1><span class="spacer"></span>
    <button class="btn" data-stopall ${active ? '' : 'disabled'} title="Stop every running and queued run">■ Stop all${active ? ` (${active})` : ''}</button>
    <button class="btn danger" data-clear title="Stop everything and remove every run, including finished reports">Clear</button>

    <div class="card" style="margin-top:14px;padding:0;overflow-x:auto">
    ${runs.length ? `<table class="t"><thead><tr><th>Run</th><th>Created</th><th>Status</th><th>Result</th>
      <th class="n">Content</th><th class="n">Critical</th><th class="n">CSS issues</th><th class="n">Sections fail / warn / pass</th><th></th></tr></thead><tbody>
      ${runs.map(r => {
        const s = r.summary;
        return `<tr class="click" data-id="${r.id}">
          <td><b>${esc(r.name)}</b> ${r.warning ? '<span class="badge b-warn" title="' + esc(r.warning) + '">same file</span> ' : ''}<span class="badge mode">${(r.mode || r.options?.mode) === 'html' ? 'PDF ⇄ Web' : 'PDF ⇄ PDF'}</span>
            <div class="small muted">${esc(r.baseline.split('/').pop())} ⇆ ${esc((r.mode || r.options?.mode) === 'html' ? r.candidate : r.candidate.split('/').pop())}</div></td>
          <td class="small">${fmtDate(r.created)}</td>

          <td>${s ? `<span class="badge b-${s.result}">${s.result}</span>` : ''}</td>
          <td class="n">${s?.content ? `<span class="pct ${pctStatus(s)}">${s.content.match_pct.toFixed(2)}%</span>` : ''}</td>
          <td class="n">${s?.critical ? (s.critical.total ? `<span class="badge crit">${s.critical.total}</span>` : '0') : ''}</td>
          <td class="n">${s?.css?.issues ?? ''}</td>
          <td class="n">${s ? `${s.fail} / ${s.warn} / ${s.pass}` : ''}</td>
          <td style="white-space:nowrap">${r.status === 'running' || r.status === 'queued' ? `<button class="btn sm" data-stop="${r.id}" title="Stop this run">■ Stop</button>` : ''}

    if (e.target.closest('a[data-dl]')) { e.stopPropagation(); return; }  // a report download: do not open the run

      if (confirm('Stop every running and queued run?')) { await api('/api/runs/stop-all', { method: 'POST' }); viewRuns(); }

    }
    if (e.target.closest('[data-clear]')) {

  };

const pctStatus = s => { const c = s.content; return c.match_pct >= c.pass_pct ? 'pass' : c.match_pct >= c.warn_pct ? 'warn' : 'fail'; };

// ---------------- single run (report workspace)
const R = { job: null, data: null, tab: 'issues', cat: 'all', types: new Set(), sevs: new Set(), section: '', q: '',
            critOnly: false, view: 'list', group: 'none', shown: 60, open: new Set(), sel: 0, topic: '' };

function readState(qs) {
  const p = new URLSearchParams(qs || '');
  Object.assign(R, {
    tab: p.get('tab') || 'issues', cat: p.get('cat') || 'all', section: p.get('sec') || '', q: p.get('q') || '', topic: p.get('topic') || '',
    types: new Set((p.get('types') || '').split('|').filter(Boolean)), sevs: new Set((p.get('sev') || '').split('|').filter(Boolean)),
    critOnly: p.get('crit') === '1', view: p.get('view') || 'list', group: p.get('group') || 'none', shown: 60, open: new Set(), sel: 0,
  });
}

function writeState() {  // keep filters in the URL (shareable, survives reload) without re-routing
  const p = new URLSearchParams();
  if (R.tab !== 'issues') p.set('tab', R.tab);
  if (R.cat !== 'all') p.set('cat', R.cat);
  if (R.types.size) p.set('types', [...R.types].join('|'));
  if (R.sevs.size) p.set('sev', [...R.sevs].join('|'));
  if (R.critOnly) p.set('crit', '1');
  if (R.section) p.set('sec', R.section);
  if (R.topic) p.set('topic', R.topic);
  if (R.q) p.set('q', R.q);
  if (R.view !== 'list') p.set('view', R.view);
  if (R.group !== 'none') p.set('group', R.group);
  const qs = p.toString();
  history.replaceState(null, '', `#/run/${R.job.id}${qs ? '?' + qs : ''}`);
}

async function viewRun(id, qs) {
  app.onclick = null;

  try { job = await api('/api/runs/' + id); } catch (e) { app.innerHTML = `<div class="empty">Run not found. <a href="#/runs">Back to runs</a></div>`; return; }
  setBrandAccent(job);
  const isWeb = (job.mode || job.options?.mode) === 'html';
  const cand = isWeb ? `Web page <a href="${esc(job.candidate)}" target="_blank" rel="noopener"><b>${esc(job.candidate)}</b></a>` : `Stage <b>${esc(job.candidate.split('/').pop())}</b>`;
  const nav = `<div class="rnav"><a class="btn sm" href="#/new">← Back</a><a class="small" href="#/runs">All runs</a>

    <a class="btn sm" href="#/new?from=${id}" title="Open the form with this run's inputs">Edit &amp; rerun</a></div>`;
  const head = nav + `<div class="rhead"><div class="rtitle"><h1>${esc(job.name)} <span class="badge mode">${isWeb ? 'PDF ⇄ Web' : 'PDF ⇄ PDF'}</span></h1>

  setTimeout(() => {
    const b = document.querySelector('[data-rerun-this]');
    if (b) b.onclick = async () => { b.disabled = true; const j = await api(`/api/runs/${id}/rerun`, { method: 'POST' }); location.hash = '#/run/' + j.id; };
  });
  if (job.status === 'queued' || job.status === 'running') {
    app.innerHTML = head + `</div><div class="card" style="margin-top:18px"><div class="row"><b>${job.status === 'queued' ? 'Waiting for another run to finish…' : 'Validating…'}</b>
      <span class="spacer"></span><span class="muted">${Math.round(job.progress * 100)}%</span>
      <button class="btn sm" data-stop-this style="margin-left:10px">■ Stop</button></div>
      <div class="bar" style="margin:10px 0"><i style="width:${job.progress * 100}%"></i></div><div class="small muted">${esc(job.message)}</div></div>`;
    const sb = document.querySelector('[data-stop-this]');
    if (sb) sb.onclick = async () => { sb.disabled = true; clearTimeout(poll); await api(`/api/runs/${id}/stop`, { method: 'POST' }); viewRun(id, qs); };
    poll = setTimeout(() => viewRun(id, qs), 1000);
    return;
  }
  if (job.status === 'stopped') {
    app.innerHTML = head + `</div><div class="card" style="margin-top:18px"><b>Run stopped</b><div class="muted">${esc(job.message)} - use Rerun to start it again.</div></div>`;

  }

    return;
  }
  if (!R.data || R.job?.id !== id) R.data = await api(`/runs/${id}/results.json`);
  if (!R.data.aem && !isWeb && !AEM_TRIED.has(id)) {  // a run from before GUIDs were traced: trace them once
    AEM_TRIED.add(id);
    try { if ((await api(`/api/runs/${id}/relink`, { method: 'POST' })).topics) R.data = await api(`/runs/${id}/results.json?t=${Date.now()}`); } catch (e) { /* not an AEM Guides PDF */ }
  }
  R.job = job;
  readState(qs);
  const d = R.data, s = d.summary, c = s.content, cst = pctStatus(s), crit = s.critical;
  const base = `/runs/${id}/`;
  document.body.classList.add('wide');
  app.innerHTML = head + `
      <div class="ractions">
        <a class="btn primary" href="${base}index.html" target="_blank" rel="noopener">Side-by-side viewer ↗</a>
        ${(d.meta || {}).consolidated ? `<a class="btn primary" href="${base}${encodeURIComponent(d.meta.consolidated)}?download=${encodeURIComponent(d.meta.consolidated)}"
            title="One file: every issue report of this run merged, named after the prod PDF">⬇ Consolidated report</a>` : ''}
        ${s.genuine ? `<a class="btn ${s.genuine.total ? 'danger' : ''}" href="${base}genuine-issues.pdf?download=${encodeURIComponent('pdf-report-' + id + '.pdf')}"
            title="Every issue, each with a description and prod/stage screenshots">⬇ PDF report (${s.genuine.total})</a>
        <a class="btn" href="${base}genuine-issues.docx?download=${encodeURIComponent('pdf-report-' + id + '.docx')}"
            title="The same issues as a Word document: issues only, with prod/stage screenshots">⬇ PDF report (Word / Docs)</a>
        <a class="btn" href="${base}genuine-issues.csv?download=${encodeURIComponent('pdf-report-' + id + '.csv')}"
            title="The same issues as a table (opens in Excel)">⬇ PDF report (CSV / Excel)</a>` : ''}
        ${(() => { const n = d.sections.reduce((k, x) => k + x.findings.filter(f => f.category === 'css' && !f.genuine).length, 0);
                   return `<a class="btn" href="${base}css-issues.pdf?download=${encodeURIComponent('css-report-' + id + '.pdf')}"
            title="Fonts, sizes, colours, line heights and design-spec styles not in the PDF report, with screenshots">⬇ CSS report (${n})</a>`; })()}
        ${(() => { const im = (d.summary || {}).images;  // the image verdict: PASS = no image issue, no image report
                   if (im && im.result === 'pass')
                     return `<span class="btn" style="color:#16a34a;cursor:default" title="No image issue: no image report for this publication">Images ✓ PASS</span>`;

            title="Only picture issues, each shown as the prod and the stage picture side by side">⬇ Image report${im ? ` — FAIL (${im.issues})` : ''}</a>`; })()}

           title="Page by page: each prod page beside the matching stage page, the issues boxed and numbered on both, with their full description">⬇ Side-by-side report</a>
        ${s.site ? `<a class="btn ${s.site.fail ? 'danger' : ''}" href="${base}site.pdf?download=${encodeURIComponent('site-report-' + id + '.pdf')}"
           title="Left navigation, links, pager, page layout / pictures and CSS vs the design spec - every row, one expectation per line">⬇ Site report${s.site.fail ? ` — FAIL (${s.site.fail})` : ''}</a>` : ''}

    <div class="kpis ${s.site ? 'five' : ''}">

      <button class="kpi" data-kpi="content" title="Show content issues"><span class="k">Content match</span><span class="pct ${cst}">${c.match_pct.toFixed(2)}%</span>
        <span class="sub">${c.missing_words} missing · ${c.extra_words} extra words</span></button>
      <button class="kpi ${crit.total ? 'is-crit' : ''}" data-kpi="critical" title="Show critical issues"><span class="k">Critical</span>

      ${s.site ? `<button class="kpi" data-tab="site" title="Left navigation, links, Download PDF, next / previous, On this page, product subtitle"><span class="k">Site navigation</span>
        <span class="badge b-${s.site.status}">${s.site.status}</span>
        <span class="sub"><span style="color:var(--fail)">${s.site.fail} fail</span> · <span style="color:var(--warn)">${s.site.warn} warn</span> · <span style="color:var(--pass)">${s.site.pass} pass</span></span></button>` : ''}
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="issues">Issues</button>${d.toc ? `<button data-tab="toc">TOC (${d.toc.summary.baseline_entries} ⇆ ${d.toc.summary.candidate_entries})</button>` : ''}
      <button data-tab="sections">Sections (${s.sections})</button>${d.aem ? `<button data-tab="topics" title="The AEM Guides topics (GUIDs) the stage issues come from">AEM topics (${d.aem.topics.length})</button>` : ''}
      <button data-tab="stylemap">Style map (${d.style_map.length})</button>
      ${d.site ? `<button data-tab="site" title="The web guide's navigation around the content">Site navigation${d.site.summary ? ` (${d.site.summary.fail} fail)` : ''}</button>` : ''}
    </div>
    <div id="tab"></div>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { R.tab = b.dataset.tab; writeState(); renderTab(); });
  app.querySelector('[data-report]')?.addEventListener('click', () => downloadReport());  // (only the genuine report is offered)
  app.querySelectorAll('[data-kpi]').forEach(b => b.onclick = () => {
    const k = b.dataset.kpi;
    Object.assign(R, { tab: 'issues', types: new Set(), sevs: new Set(), section: '', q: '', shown: 60, open: new Set(), sel: 0,
                       cat: k === 'critical' ? 'all' : k, critOnly: k === 'critical' });
    writeState(); renderTab();
  });
  renderTab();
}

function allIssues() {
  return R.data.sections.flatMap(s => s.findings.map(f => ({ f, s })));
}

function matches({ f, s }, skip = '') {
  const q = R.q.toLowerCase();
  return (skip === 'crit' || !R.critOnly || f.critical)
    && (skip === 'cat' || R.cat === 'all' || f.category === R.cat)
    && (skip === 'types' || skip === 'cat' || !R.types.size || f.types.some(t => R.types.has(t)))
    && (skip === 'sev' || !R.sevs.size || R.sevs.has(f.severity))
    && (skip === 'sec' || !R.section || s.id === R.section)
    && (skip === 'topic' || !R.topic || f.aem?.guid === R.topic)
    && (!q || f.message.toLowerCase().includes(q) || s.title.toLowerCase().includes(q) || f.types.join(' ').includes(q)
        || (f.aem && (f.aem.guid.toLowerCase().includes(q) || f.aem.topic.toLowerCase().includes(q))));
}

function filteredIssues() {
  const list = allIssues().filter(x => matches(x));
  if (R.group === 'type') list.sort((a, b) => a.f.types[0].localeCompare(b.f.types[0]));
  return list;
}

function renderTab() {
  app.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === R.tab));
  const el = $('#tab'), d = R.data, base = `/runs/${R.job.id}/`;
  document.onkeydown = null;
  if (R.tab === 'sections') {
    el.innerHTML = `<div class="card" style="padding:0;overflow-x:auto"><table class="t"><thead><tr><th>Section</th><th>Prod p.</th><th>Stage p.</th><th>Status</th>
      <th class="n">Content %</th><th class="n">Missing / extra words</th><th class="n">Critical</th>
      ${CATS.map(([c, l]) => `<th class="n"><span class="dot" style="background:var(--k-${c})"></span> ${l}</th>`).join('')}<th></th></tr></thead><tbody>
      ${d.sections.map(s => `<tr class="click" data-sec="${s.id}"><td style="padding-left:${10 + 12 * Math.max(0, s.level - 1)}px">${esc(s.title)}</td>
        <td>${s.baseline.start.page + 1}–${s.baseline.end.page + 1}</td><td>${s.candidate.start.page + 1}–${s.candidate.end.page + 1}</td>
        <td><span class="badge b-${s.status}">${s.status}</span></td>
        <td class="n"><span class="pct ${s.content.status}">${s.content.match_pct.toFixed(2)}%</span></td>
        <td class="n">${s.content.missing_words} / ${s.content.extra_words}</td>
        <td class="n">${s.critical ? `<span class="badge crit">${s.critical}</span>` : ''}</td>
        ${CATS.map(([c]) => `<td class="n">${s.categories?.[c] ? `<a href="#" data-sec-cat="${c}">${s.categories[c]}</a>` : ''}</td>`).join('')}
        <td><a href="${base}index.html#${s.id}" target="_blank" rel="noopener" class="small" data-stop>viewer ↗</a></td></tr>`).join('')}
      </tbody></table></div>`;
    el.onclick = e => {
      if (e.target.closest('[data-stop]')) return;
      const r = e.target.closest('[data-sec]');
      if (!r) return;
      e.preventDefault();
      const c = e.target.closest('[data-sec-cat]');
      Object.assign(R, { tab: 'issues', section: r.dataset.sec, cat: c ? c.dataset.secCat : 'all', types: new Set(), sevs: new Set(), critOnly: false, shown: 60 });
      writeState(); renderTab();
    };
    return;
  }
  if (R.tab === 'toc') { renderToc(el); return; }
  if (R.tab === 'topics') { renderTopics(el); return; }
  if (R.tab === 'site') { renderSite(el); return; }
  if (R.tab === 'stylemap') {
    el.innerHTML = `<p class="muted">Every font / size / colour mismatch across the document, grouped by role. Each row is one CSS rule to fix in the stage stylesheet.</p>
      <div class="card" style="padding:0;overflow-x:auto"><table class="t"><thead><tr><th>Role</th><th>Prod</th><th>Stage</th><th class="n">Words</th><th class="n">Sections</th></tr></thead><tbody>
      ${d.style_map.map(m => `<tr><td>${esc(m.role)}</td><td><code>${esc(m.baseline)}</code></td><td><code><b>${esc(m.candidate)}</b></code></td>
        <td class="n">${m.words}</td><td class="n">${m.sections}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No style differences</td></tr>'}</tbody></table></div>`;
    el.onclick = null;
    return;
  }
  el.innerHTML = `<div class="workspace"><aside class="side" id="side"></aside><section class="results"><div class="rbar" id="rbar"></div><div id="ilist"></div></section></div>`;
  renderSide();
  renderIssues();
  el.onclick = onWorkspaceClick;
  el.oninput = e => {
    if (e.target.id === 'iq') { R.q = e.target.value; R.shown = 60; writeState(); renderSide(true); renderIssues(); }
    if (e.target.id === 'secq') renderSectionList(e.target.value);
  };
  el.onchange = e => {
    if (e.target.id === 'group') { R.group = e.target.value; writeState(); renderIssues(); }
  };
  document.onkeydown = onKeys;
}

function renderSide(keepSearch) {
  const all = allIssues();
  const count = (pred, skip) => all.filter(x => matches(x, skip) && pred(x)).length;
  const typeCounts = {};
  all.filter(x => matches(x, 'types')).forEach(x => x.f.types.forEach(t => typeCounts[t] = (typeCounts[t] || 0) + 1));
  const side = $('#side');
  const q = keepSearch ? $('#iq')?.value : R.q;
  const focused = document.activeElement?.id;
  side.innerHTML = `
    <input type="search" id="iq" placeholder="Search issues…" value="${esc(q ?? '')}" aria-label="Search issues">
    <div class="sgroup"><div class="sh">Category</div>
      <button class="nav ${R.cat === 'all' ? 'on' : ''}" data-cat="all"><span>All issues</span><span class="n">${count(() => true, 'cat')}</span></button>
      ${CATS.map(([c, l]) => `<button class="nav ${R.cat === c ? 'on' : ''}" data-cat="${c}"><span><span class="dot" style="background:var(--k-${c})"></span> ${l}</span>
        <span class="n">${count(x => x.f.category === c, 'cat')}</span></button>`).join('')}
    </div>
    ${R.cat !== 'all' ? `<div class="sgroup"><div class="sh">${CAT_LABEL[R.cat]} types ${R.types.size ? '<a href="#" data-clear-types>clear</a>' : ''}</div>
      ${Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
        `<label class="chk"><input type="checkbox" data-type="${esc(t)}" ${R.types.has(t) ? 'checked' : ''}><span>${esc(t)}</span><span class="n">${n}</span></label>`).join('') || '<div class="muted small">none</div>'}
    </div>` : ''}
    <div class="sgroup"><div class="sh">Severity</div>
      <label class="chk"><input type="checkbox" data-crit ${R.critOnly ? 'checked' : ''}><span><span class="badge crit">critical</span> only</span><span class="n">${count(x => x.f.critical, 'crit')}</span></label>
      ${SEVS.map(v => `<label class="chk"><input type="checkbox" data-sev="${v}" ${R.sevs.has(v) ? 'checked' : ''}><span><span class="badge b-${v}">${v}</span></span><span class="n">${count(x => x.f.severity === v, 'sev')}</span></label>`).join('')}
    </div>
    ${R.data.aem ? `<div class="sgroup"><div class="sh">AEM topic (GUID) ${R.topic ? '<a href="#" data-topic="">all</a>' : ''}</div>
      ${R.data.aem.topics.map(t => { const n = all.filter(x => x.f.aem?.guid === t.guid && matches(x, 'topic')).length;
        return `<button class="nav sec ${R.topic === t.guid ? 'on' : ''}" data-topic="${t.guid}" title="${esc(t.guid)}"><span class="t">${esc(t.topic || t.guid)}</span><span class="n">${n || ''}</span></button>`; }).join('')}
    </div>` : ''}
    <div class="sgroup"><div class="sh">Section ${R.section ? '<a href="#" data-sec="">all</a>' : ''}</div>
      <input type="search" id="secq" placeholder="Find section…" aria-label="Find section">
      <div id="seclist" class="seclist"></div>
    </div>
    <button class="btn sm" data-reset style="width:100%">Reset filters</button>`;
  renderSectionList('');
  if (focused === 'iq') { const i = $('#iq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

function renderSectionList(filter) {
  const all = allIssues();
  const f = (filter || '').toLowerCase();
  $('#seclist').innerHTML = R.data.sections.filter(s => !f || s.title.toLowerCase().includes(f)).map(s => {
    const n = all.filter(x => x.s.id === s.id && matches(x, 'sec')).length;
    return `<button class="nav sec ${R.section === s.id ? 'on' : ''}" data-sec="${s.id}" title="${esc(s.title)}">
      <span class="dot st-${s.status}"></span><span class="t">${esc(s.title)}</span>
      <span class="pct ${s.content.status}" title="score: 100% − 0.1% per issue in the PDF report">${s.content.match_pct.toFixed(1)}%</span><span class="n">${n || ''}</span></button>`;
  }).join('');
}

function onWorkspaceClick(e) {
  const t = e.target;
  const set = patch => { Object.assign(R, { shown: 60, open: new Set(), sel: 0 }, patch); writeState(); renderSide(); renderIssues(); };
  let el;
  if ((el = t.closest('[data-cat]'))) return set({ cat: el.dataset.cat, types: new Set() });
  if ((el = t.closest('input[data-type]'))) { const v = el.dataset.type; R.types.has(v) ? R.types.delete(v) : R.types.add(v); return set({}); }
  if (t.closest('[data-clear-types]')) { e.preventDefault(); return set({ types: new Set() }); }
  if (t.closest('input[data-crit]')) return set({ critOnly: !R.critOnly });
  if ((el = t.closest('input[data-sev]'))) { const v = el.dataset.sev; R.sevs.has(v) ? R.sevs.delete(v) : R.sevs.add(v); return set({}); }
  if ((el = t.closest('[data-copy]'))) { e.preventDefault(); return copyGuid(el); }
  if ((el = t.closest('[data-topic]'))) { e.preventDefault(); return set({ topic: el.dataset.topic }); }
  if ((el = t.closest('[data-sec]')) && !t.closest('.issue-row, .card-issue')) { e.preventDefault(); return set({ section: el.dataset.sec }); }
  if (t.closest('[data-reset]')) return set({ cat: 'all', types: new Set(), sevs: new Set(), critOnly: false, section: '', q: '', topic: '' });
  if ((el = t.closest('[data-pill]'))) {
    const [k, v] = el.dataset.pill.split(':');
    if (k === 'cat') return set({ cat: 'all', types: new Set() });
    if (k === 'type') { R.types.delete(v); return set({}); }
    if (k === 'sev') { R.sevs.delete(v); return set({}); }
    if (k === 'crit') return set({ critOnly: false });
    if (k === 'sec') return set({ section: '' });
    if (k === 'topic') return set({ topic: '' });
    if (k === 'q') return set({ q: '' });
  }
  if ((el = t.closest('[data-view]'))) { R.view = el.dataset.view; writeState(); return renderIssues(); }
  if (t.id === 'more') { R.shown += 60; return renderIssues(); }
  if ((el = t.closest('.shot'))) return openLightbox(+el.dataset.idx);
  if (t.closest('a, button, select, input')) return;
  if ((el = t.closest('.issue-row'))) { toggleRow(+el.dataset.idx); }
}

function toggleRow(i) {
  R.sel = i;
  R.open.has(i) ? R.open.delete(i) : R.open.add(i);
  renderIssues(true);
}

function viewerLink(f, s) {
  return `/runs/${R.job.id}/index.html#${s.id}:${+f.id.split('-')[1]}`;
}

function shotsHtml(f, i) {
  const base = `/runs/${R.job.id}/`, sh = f.shots || {};

    <figure><figcaption>Stage · p.${sh.candidate_page ?? '?'}${kindNote(sh.candidate_kind)}</figcaption>${sh.candidate ? `<img class="shot" loading="lazy" data-idx="${i}" src="${base}${sh.candidate}" alt="Stage screenshot for issue ${f.id}">` : ''}</figure>

}

// ---------------- AEM Guides source topics (GUIDs)
const shortGuid = g => g.replace(/^GUID-([0-9a-f]{8}).*$/i, 'GUID-$1…');

function guidChip(a, short) {
  if (!a) return '';
  const label = esc(short ? shortGuid(a.guid) : a.guid);
  return a.url
    ? `<a class="guid" href="${esc(a.url)}" target="_blank" rel="noopener" title="Open topic “${esc(a.topic)}” in AEM (new tab)\n${esc(a.guid)}">${label} ↗</a>`
    : `<button class="guid off" data-copy="${esc(a.guid)}" title="${esc(a.guid)} — click to copy. Set the AEM author URL in the AEM topics tab to make it a link.">${label}</button>`;
}

function sourceHtml(f) {
  const a = f.aem;
  if (!a) return R.data.aem ? '<div class="src small muted"><span class="k">Source</span> cover / TOC — generated from the ditamap and PDF template, not a topic</div>' : '';
  return `<div class="src"><span class="k">Source topic</span><b>${esc(a.topic || '—')}</b>${guidChip(a)}
    <button class="btn sm" data-copy="${esc(a.guid)}" title="Copy the GUID">Copy GUID</button>
    ${a.element ? `<span class="muted small">near <code>${esc(a.element)}</code>${a.element_title ? ' “' + esc(a.element_title) + '”' : ''}</span>` : ''}
    ${a.exact ? '' : '<span class="muted small">(issue has no position in stage: topic of the section start)</span>'}</div>`;
}

function copyGuid(el) {
  const g = el.dataset.copy;
  (navigator.clipboard?.writeText(g) || Promise.reject()).then(
    () => { const t = el.textContent; el.textContent = 'Copied ✓'; setTimeout(() => el.textContent = t, 1200); },
    () => prompt('Copy the GUID:', g));
}

  $('#aemform').onsubmit = async e => {
