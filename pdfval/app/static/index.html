    const st = $('#aemstatus'); st.textContent = 'Saving…'; st.classList.remove('err');
    try {
      const products = { ...(cfg.products || {}) };
      const f = $('#aem-folder').value.trim();
      if (a.product) { if (f) products[a.product] = f; else delete products[a.product]; }
      await api('/api/aem', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author: $('#aem-author').value.trim(), link: $('#aem-link').value.trim(), dam_root: cfg.dam_root || '', products,
                               user: $('#aem-user').value.trim(), password: $('#aem-pass').value }) });
      await api(`/api/runs/${R.job.id}/relink`, { method: 'POST' });
      R.data = await api(`/runs/${R.job.id}/results.json?t=${Date.now()}`);
      renderTopics(el);
    } catch (err) { st.textContent = err.message; st.classList.add('err'); }
  };
}

// ---------------- Site navigation: the web guide's chrome (left nav vs L1 TOC, links, download, pager, on this page, subtitle)
function renderSite(el) {
  const st = R.data.site, base = `/runs/${R.job.id}/`;
  if (!st.rows) { el.innerHTML = `<div class="card">Site navigation was not checked: ${esc(st.error || 'no data')}</div>`; return; }
  const sm = st.summary, g = R.siteGroup || '', f = R.siteFilter || 'issues';
  const worst = c => c.fail ? 'fail' : c.warn ? 'warn' : 'pass';
  const rows = st.rows.filter(r => (!g || r.group === g) && (f === 'all' || r.status === 'fail' || r.status === 'warn'));
  const title = Object.fromEntries(st.groups.map(x => [x.id, x.title]));
  const short = u => { try { const x = new URL(u); return x.pathname.split('/').pop() || x.pathname; } catch (e) { return u; } };
  const src = st.subtitle_source || {};
  el.innerHTML = `
    <div class="card" style="margin-bottom:12px"><div class="row">
      <div><b>${sm.pages} page(s)</b> checked · L1 TOC of the PDF: ${sm.l1.length} entries
        ${st.download?.found ? ` · Download PDF: ${st.download.file ? `<a href="${base}${esc(st.download.file)}" target="_blank" rel="noopener">downloaded file ↗</a>` : esc(st.download.error || 'not a PDF')}` : ''}
        ${src.property ? ` · subtitle from AEM <code>${esc(src.page)}/jcr:content/${esc(src.property)}</code>` : ''}</div>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Rows"><button data-sf="issues" aria-pressed="${f === 'issues'}">Problems only</button><button data-sf="all" aria-pressed="${f === 'all'}">All checks</button></div>
</div></div>
    <div class="sitegroups">${st.groups.map(x => { const c = sm.groups[x.id]; return `<button class="s-${worst(c)}" data-sg="${x.id}" aria-pressed="${g === x.id}">
      <b>${esc(x.title)}</b><span class="n"><span style="color:var(--fail)">${c.fail} fail</span> · <span style="color:var(--warn)">${c.warn} warn</span> · ${c.pass} pass</span></button>`; }).join('')}</div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="t site"><thead><tr><th>Status</th>${g ? '' : '<th>Check</th>'}<th>Item</th><th>Expected</th><th>Actual</th><th>Page</th><th>Note</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="st"><span class="badge b-${r.status}">${r.status}</span></td>${g ? '' : `<td>${esc(title[r.group])}</td>`}
        <td><b>${esc(r.item)}</b>${r.where ? `<div><code title="Element the value is read from">${esc(r.where)}</code></div>` : ''}</td>
        <td>${esc(r.expected)}</td><td>${esc(r.actual)}</td>
        <td>${r.page ? `<a href="${esc(r.page)}" target="_blank" rel="noopener" title="${esc(r.page)}">${esc(short(r.page))} ↗</a>` : ''}</td>
        <td class="small">${esc(r.note)}</td></tr>`).join('') || `<tr><td colspan="7" class="muted">${f === 'issues' ? 'No problems found.' : 'No checks.'}</td></tr>`}
    </tbody></table></div>`;
  el.onclick = e => {
    const b = e.target.closest('[data-sg]');
    if (b) { R.siteGroup = R.siteGroup === b.dataset.sg ? '' : b.dataset.sg; return renderSite(el); }
    const v = e.target.closest('[data-sf]');
    if (v) { R.siteFilter = v.dataset.sf; return renderSite(el); }
  };
}

// ---------------- TOC: full prod TOC (left) vs stage TOC (right) – pages and entries
const TOC_STATUS = { 'match': 'pass', 'level differs': 'warn', 'title differs': 'warn', 'order differs': 'fail',
                     'missing in stage': 'fail', 'extra in stage': 'info' };
const tocPass = r => R.tocFilter === 'all' || (R.tocFilter === 'diff' ? r.status !== 'match' || r.flags.length
  : R.tocFilter === 'wrong page' ? r.flags.some(x => x.endsWith('page wrong')) : r.status === R.tocFilter);

function renderToc(el) {
  const t = R.data.toc, sm = t.summary;
  R.tocFilter = R.tocFilter || 'all';
  R.tocView = R.tocView || 'pages';
  const chip = (k, label, n) => `<button class="chip opt" data-tocf="${k}" aria-pressed="${R.tocFilter === k}">${label} <b>${n}</b></button>`;
  const headDiff = t.heading.baseline && t.heading.candidate && t.heading.baseline.trim().toLowerCase() !== t.heading.candidate.trim().toLowerCase();
  const cl = R.data.meta.mode === 'html' ? 'web page' : 'stage';
  el.innerHTML = `
    <div class="tocbanner ts-${sm.status}">
      <div><span class="k">TOC status</span><span class="badge b-${sm.status}" style="font-size:15px">${sm.status}</span></div>
      <div><span class="k">Sequence</span><b class="${sm.sequence_ok ? 'ok' : 'bad'}">${sm.sequence_ok ? '✓ Same order' : `✗ ${sm['order differs']} out of order`}</b></div>
      <div><span class="k">Levels matching</span><b>${sm.levels_match_pct}%</b></div>
      <div><span class="k">Entries</span><b>${sm.baseline_entries} prod · ${sm.candidate_entries} ${cl}</b></div>
      <div><span class="k">Levels</span><b>${t.levels.baseline} prod · ${t.levels.candidate} ${cl}</b></div>
      <div><span class="k">TOC heading</span>${t.heading.candidate || t.source.candidate === 'printed'
        ? `<b class="${headDiff ? 'bad' : ''}">“${esc(t.heading.baseline || '—')}” ${headDiff ? '≠' : '='} “${esc(t.heading.candidate || '—')}”</b>`
        : `<b>“${esc(t.heading.baseline || '—')}” · ${cl}: ${t.source.candidate === 'bookmarks' ? 'heading outline (no printed TOC)' : 'none'}</b>`}</div>
    </div>
    <div class="types">${chip('all', 'All', t.rows.length)}${chip('diff', 'Only differences', t.rows.filter(r => r.status !== 'match' || r.flags.length).length)}
      ${chip('match', '✓ Match', sm.match)}${chip('level differs', 'Level differs', sm['level differs'])}${chip('order differs', 'Order differs', sm['order differs'])}
      ${chip('title differs', 'Title differs', sm['title differs'])}${chip('missing in stage', `Missing in ${cl}`, sm['missing in stage'])}
      ${chip('extra in stage', `Extra in ${cl}`, sm['extra in stage'])}${chip('wrong page', 'Wrong page no.', sm['wrong page'])}
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="TOC view"><button data-tocv="pages" aria-pressed="${R.tocView === 'pages'}">Pages side by side</button><button data-tocv="table" aria-pressed="${R.tocView === 'table'}">Entry table</button></div>
    </div>
    <div class="legend"><span class="lg ts-pass"></span>match <span class="lg ts-warn"></span>level / title differs <span class="lg ts-fail"></span>order differs / missing
      <span class="lg ts-info"></span>extra in stage <span class="lg wrongpg"></span>wrong page no.</div>
    <div id="tocsel" class="tocsel"></div>
    <div id="tocbody"></div>`;
  el.onclick = e => {
    const f = e.target.closest('[data-tocf]');
    if (f) { R.tocFilter = f.dataset.tocf; return renderToc(el); }
    const v = e.target.closest('[data-tocv]');
    if (v) { R.tocView = v.dataset.tocv; return renderToc(el); }
    const bx = e.target.closest('[data-trow]');
    if (bx) return selectTocRow(+bx.dataset.trow, bx.closest('.tcol')?.dataset.side);
    const r = e.target.closest('.tocrow');
    if (r && !e.target.closest('.shot')) { const k = +r.dataset.row; R.tocOpen = R.tocOpen === k ? null : k; renderTocTable(); }
  };
  R.tocView === 'pages' ? renderTocPages() : renderTocTable();
  if (R.tocSel != null) selectTocRow(R.tocSel, null, true);
}

function renderTocPages() {
  const t = R.data.toc, base = `/runs/${R.job.id}/`;
  const col = (side, label) => {
    const imgs = (t.images || {})[side] || [];
    return `<div class="tcol" data-side="${side}"><div class="tcolhead">${label} · ${t.levels[side]} levels${t.pages[side].length ? ` · pages ${t.pages[side].join(', ')}` : ''}</div>
      <div class="tscroll">${imgs.map(im => {
        const [pw, ph] = t.page_size[side][im.page];
        const boxes = t.rows.map((r, k) => [r, k]).filter(([r]) => r[side] && r[side].toc_page === im.page).map(([r, k]) => {
          const e = r[side], [x0, y0, x1, y1] = e.bbox, pos = r.pos[side];
          const other = side === 'baseline' ? 'candidate' : 'baseline';
          const tip = `#${pos} · L${e.level} · ${r.status}${r[other] ? ` · ${side === 'baseline' ? 'stage' : 'prod'} #${r.pos[other]} L${r[other].level}` : ''}${e.page_ok === false ? ' · page number wrong' : ''}`;
          return `<div class="tbox ts-${TOC_STATUS[r.status]} ${e.page_ok === false ? 'wrongpg' : ''} ${tocPass(r) ? '' : 'dim'}" data-trow="${k}" title="${esc(tip)}"
            style="left:${x0 / pw * 100 - 0.6}%;top:${y0 / ph * 100 - 0.3}%;width:${(x1 - x0) / pw * 100 + 1.2}%;height:${(y1 - y0) / ph * 100 + 0.6}%">
            <span class="tpos">${pos}</span></div>`;
        }).join('');
        return `<div class="tpage"><img src="${base}${im.src}" alt="${label} TOC page ${im.page}" loading="lazy"><span class="tpno">p.${im.page}</span>${boxes}</div>`;
      }).join('') || outlineList(side)}</div></div>`;
  };
  $('#tocbody').innerHTML = `<div class="tpages">${col('baseline', 'Prod TOC')}${col('candidate', t.source.candidate === 'navigation' ? 'Stage TOC (left navigation)' : R.data.meta.mode === 'html' ? 'Web page outline' : 'Stage TOC')}</div>`;
  // the two columns scroll together, aligned by entries present on both sides
  const [L, Rt] = [...document.querySelectorAll('.tscroll')];
  const pts = () => t.rows.filter(r => r.baseline && r.candidate).map(r => {
    const k = t.rows.indexOf(r);
    const a = L.querySelector(`[data-trow="${k}"]`), b = Rt.querySelector(`[data-trow="${k}"]`);
    return a && b ? [a.offsetTop + a.parentElement.offsetTop, b.offsetTop + b.parentElement.offsetTop] : null;
  }).filter(Boolean);
  let P = null, lock = null;
  const follow = (src, dst, i, j) => {
    if (lock === dst) return;
    P = P || pts();
    if (P.length < 2) return;
    const fx = src.scrollTop + src.clientHeight * 0.3;
    let k = 0; while (k < P.length - 2 && P[k + 1][i] <= fx) k++;
    const [a0, a1, b0, b1] = [P[k][i], P[k + 1][i], P[k][j], P[k + 1][j]];
    const y = b0 + (a1 === a0 ? 0 : (fx - a0) / (a1 - a0)) * (b1 - b0);
    lock = src; dst.scrollTop = y - dst.clientHeight * 0.3;
    requestAnimationFrame(() => { lock = null; });
  };
  L.onscroll = () => follow(L, Rt, 0, 1);
  Rt.onscroll = () => follow(Rt, L, 1, 0);
  document.querySelectorAll('.tpage img').forEach(img => img.addEventListener('load', () => { P = null; }));
}

// a side without a printed TOC (a web page, or a PDF with bookmarks only): show its outline as a list
// content differences: the quoted prod / stage words in red. A design-spec issue ("…\nFigma: …\nStage: …", or Prod: …):
// its headline, then a Figma row and a Stage row (short: the headline only, for one-line rows)
function msgHtml(f, short) {
  const m = f.message || '';
  if (!m.includes('\n')) return f.check !== 'content' ? esc(m)
    : esc(m).replace(/“([^”]*)”/g, '“<b style="color:var(--c-content)">$1</b>”');
  if (short) return esc(m.split('\n')[0]);
  return m.split('\n\n').map(block => block.split('\n').map(ln => {
    const lab = /^(Figma|Prod|Stage): /.exec(ln);
    return lab ? `<div class="fs"><b class="${lab[1] === 'Figma' ? 'fig' : lab[1] === 'Prod' ? 'prd' : 'stg'}">${lab[1]}</b><span>${esc(ln.slice(lab[0].length))}</span></div>`
      : `<div>${esc(ln)}</div>`;
  }).join('')).join('<div class="fgap"></div>');
}

function outlineList(side) {
  const t = R.data.toc;
  const items = t.rows.map((r, k) => [r, k]).filter(([r]) => r[side]);
  if (!items.length) return '<div class="empty">No TOC on this side.</div>';
  return `<div class="toutline"><div class="small muted" style="margin-bottom:8px">${t.source[side] === 'navigation' ? 'Left navigation of the web guide' : t.source[side] === 'bookmarks' ? (R.data.meta.mode === 'html' ? 'Heading outline of the web page (h1–h6)' : 'PDF bookmarks (no printed TOC)') : ''}</div>
    ${items.map(([r, k]) => { const e = r[side];
      return `<div class="tbox ts-${TOC_STATUS[r.status]} ${tocPass(r) ? '' : 'dim'}" data-trow="${k}" title="#${r.pos[side]} · L${e.level} · ${esc(r.status)}"
        style="position:relative;margin:3px 0 3px ${(e.level - 1) * 22 + 26}px;padding:4px 8px;background:#fff"><span class="tpos">${r.pos[side]}</span>
        <span class="lvl l${Math.min(e.level, 4)}" style="font-size:10px;color:#fff;border-radius:4px;padding:1px 5px;margin-right:6px">L${e.level}</span>${esc(e.title)}</div>`; }).join('')}</div>`;
}

function selectTocRow(k, fromSide, quiet) {
  const t = R.data.toc, r = t.rows[k];
  R.tocSel = k;
  document.querySelectorAll('.tbox.sel').forEach(n => n.classList.remove('sel'));
  document.querySelectorAll(`.tbox[data-trow="${k}"]`).forEach(n => {
    n.classList.add('sel');
    const side = n.closest('.tcol').dataset.side;
    if (!quiet && side !== fromSide) {
      const sc = n.closest('.tscroll');
      sc.scrollTo({ top: n.offsetTop + n.parentElement.offsetTop - sc.clientHeight * 0.3, behavior: 'smooth' });
    }
  });
  const e = x => x ? `<b>${esc(x.title)}</b> · L${x.level} · p.${x.page ?? '—'}${x.page_ok === false ? ' ⚠' : ''}` : '<span class="muted">not in this TOC</span>';
  $('#tocsel').innerHTML = `<span class="badge b-${TOC_STATUS[r.status]}">${r.status}</span>
    <span>Prod #${r.pos.baseline ?? '—'}: ${e(r.baseline)}</span><span class="arrow">⇆</span><span>Stage #${r.pos.candidate ?? '—'}: ${e(r.candidate)}</span>
    ${r.flags.length ? `<span class="muted small">${esc(r.flags.join(' · '))}</span>` : ''}`;
  $('#tocsel').classList.add('on');
}

function renderTocTable() {
  const t = R.data.toc;
  const rowFinding = {};
  R.data.sections.forEach(s => s.findings.forEach(f => { if (f.category === 'toc' && f.detail.row !== undefined) (rowFinding[f.detail.row] ||= []).push(f); }));
  const side = e => e ? `<span class="lvl l${Math.min(e.level, 4)}">L${e.level}</span>
      <span class="tt" style="padding-left:${(e.level - 1) * 18}px">${esc(e.title)}</span>
      <span class="pg ${e.page_ok === false ? 'bad' : ''}" title="${e.page_ok === false ? `says p.${e.page}, heading on PDF p.${e.actual_page}` : 'printed page'}">${e.page ?? ''}${e.page_ok === false ? ' ⚠' : ''}</span>` : '<span class="none">—</span>';
  $('#tocbody').innerHTML = `<div class="card toc" style="padding:0">
      <div class="tochead"><span>Prod #</span><span>Prod (baseline)</span><span>Status</span><span>Stage (candidate)</span><span>Stage #</span></div>
      ${t.rows.map((r, k) => tocPass(r) ? `<div class="tocrow ts-${TOC_STATUS[r.status]} ${R.tocOpen === k ? 'open' : ''}" data-row="${k}">
        <span class="no">${r.pos.baseline ?? '—'}</span>
        <span class="tside">${side(r.baseline)}</span>
        <span class="status"><span class="badge b-${TOC_STATUS[r.status]}">${r.status}</span>${r.status === 'level differs' || r.flags.includes('level differs') ? `<small>L${r.baseline.level} → L${r.candidate.level}</small>` : ''}${r.status === 'order differs' ? `<small>#${r.pos.baseline} → #${r.pos.candidate}</small>` : ''}${r.flags.filter(x => x.endsWith('page wrong')).map(x => `<small class="bad">${x}</small>`).join('')}</span>
        <span class="tside">${side(r.candidate)}</span>
        <span class="no">${r.pos.candidate ?? '—'}</span>
        ${R.tocOpen === k && rowFinding[k] ? `<div class="detail">${rowFinding[k].map(f => `<div class="small" style="margin:6px 0">${esc(f.message)}</div>`).join('')}${shotsHtml(rowFinding[k][0], -1)}</div>` : ''}
      </div>` : '').join('')}
    </div>`;
}

let current = [];
function renderIssues(keepScroll) {
  current = filteredIssues();
  const pills = [];
  if (R.cat !== 'all') pills.push(['cat', CAT_LABEL[R.cat]]);
  R.types.forEach(t => pills.push(['type:' + t, t]));
  R.sevs.forEach(v => pills.push(['sev:' + v, v]));
  if (R.critOnly) pills.push(['crit', 'critical only']);
  if (R.section) pills.push(['sec', R.data.sections.find(s => s.id === R.section)?.title || R.section]);
  if (R.topic) pills.push(['topic', 'AEM ' + (R.data.aem?.topics.find(t => t.guid === R.topic)?.topic || R.topic)]);
  if (R.q) pills.push(['q', `“${R.q}”`]);
  $('#rbar').innerHTML = `<b>${current.length}</b> issue${current.length === 1 ? '' : 's'}
    ${pills.map(([k, l]) => `<button class="pill" data-pill="${esc(k)}" title="Remove filter">${esc(l)} ✕</button>`).join('')}
    <span class="spacer"></span>
    <label class="small muted">Group <select id="group"><option value="none">none</option><option value="section" ${R.group === 'section' ? 'selected' : ''}>by section</option><option value="type" ${R.group === 'type' ? 'selected' : ''}>by type</option></select></label>
    <div class="seg" role="group" aria-label="View"><button data-view="list" aria-pressed="${R.view === 'list'}">List</button><button data-view="cards" aria-pressed="${R.view === 'cards'}">Cards</button></div>
    <span class="small muted keys" title="Keyboard">j/k move · Enter expand · o viewer</span>`;
  const list = current.slice(0, R.shown);
  const rows = [];
  let lastGroup = null;
  list.forEach(({ f, s }, i) => {
    const g = R.group === 'section' ? s.id : R.group === 'type' ? f.types[0] : null;
    if (g !== null && g !== lastGroup) {
      lastGroup = g;
      rows.push(R.group === 'section'
        ? `<div class="ghead"><span class="dot st-${s.status}"></span><b>${esc(s.title)}</b><span class="pct ${s.content.status}">${s.content.match_pct.toFixed(2)}%</span>
            <span class="muted small">prod p.${s.baseline.start.page + 1} · stage p.${s.candidate.start.page + 1}</span><span class="spacer"></span>
            <span class="muted small">${current.filter(x => x.s.id === s.id).length} issues</span></div>`
        : `<div class="ghead"><b>${esc(g)}</b><span class="spacer"></span><span class="muted small">${current.filter(x => x.f.types[0] === g).length} issues</span></div>`);
    }
    const pa = f.baseline[0] ? 'p.' + (f.baseline[0].page + 1) : '—', pc = f.candidate[0] ? 'p.' + (f.candidate[0].page + 1) : '—';
    const tags = `${f.critical ? '<span class="badge crit">critical</span>' : ''}<span class="sevdot ${f.severity}" title="${f.severity}"></span>
      <span class="cat" style="--kc:${f.color || `var(--k-${f.category})`}">${CAT_LABEL[f.category]}</span><span class="type">${esc(f.types.join(', '))}</span>${guidChip(f.aem, true)}`;
    if (R.view === 'cards') {
      rows.push(`<article class="issue card-issue ${f.critical ? 'is-crit' : ''}" style="border-left-color:${f.color || `var(--k-${f.category})`}">
        <div class="meta">${tags}<span>${esc(s.title)}</span><span class="sp">prod ${pa} ⇆ stage ${pc}</span>
          <a href="${viewerLink(f, s)}" target="_blank" rel="noopener">viewer ↗</a></div>
        <div class="msg">${msgHtml(f)}</div>${sourceHtml(f)}${shotsHtml(f, i)}</article>`);
    } else {
      const open = R.open.has(i);
      rows.push(`<div class="issue-row ${open ? 'open' : ''} ${R.sel === i ? 'sel' : ''} ${f.critical ? 'is-crit' : ''}" data-idx="${i}" tabindex="-1" style="--kc:${f.color || `var(--k-${f.category})`}">
        <div class="line"><span class="chev">${open ? '▾' : '▸'}</span>${tags}<span class="m">${msgHtml(f, true)}</span>
          <span class="where">${esc(s.title)}</span><span class="pages">${pa} ⇆ ${pc}</span></div>
        ${open ? `<div class="detail">${sourceHtml(f)}${shotsHtml(f, i)}<div class="dactions"><a class="btn sm" href="${viewerLink(f, s)}" target="_blank" rel="noopener">Open this issue in the viewer ↗</a>
          <button class="btn sm" data-sec="${s.id}">Only this section</button><span class="muted small">#${f.id}</span></div></div>` : ''}
      </div>`);
    }
  });
  const y = window.scrollY;
  $('#ilist').innerHTML = (rows.join('') || '<div class="empty">No issues match these filters. ✓</div>') +
    (current.length > R.shown ? `<div style="text-align:center;margin:14px 0"><button class="btn" id="more">Show more (${current.length - R.shown} left)</button></div>` : '');
  if (keepScroll) window.scrollTo(0, y);
}

function onKeys(e) {
  if (R.tab !== 'issues' || e.target.matches('input, select, textarea') || document.querySelector('.lightbox')) return;
  const n = Math.min(current.length, R.shown);
  if (!n) return;
  if (e.key === 'j' || e.key === 'k') {
    R.sel = Math.max(0, Math.min(n - 1, R.sel + (e.key === 'j' ? 1 : -1)));
    renderIssues(true);
    document.querySelector(`.issue-row[data-idx="${R.sel}"]`)?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); toggleRow(R.sel);
  } else if (e.key === 'o') {
    const { f, s } = current[R.sel]; window.open(viewerLink(f, s), '_blank', 'noopener');
  }
}

// ---------------- PDF / CSV report: pick the issue types, severities and parts first, then download
const REPORT_PARTS = [['summary', 'Summary (documents, verdicts)'], ['genuine', 'Genuine issues overview'], ['critical', 'Critical issues table'],
  ['sections', 'Per-section results'], ['toc', 'TOC comparison'], ['stylemap', 'Font / style map'], ['issues', 'Issue list'],
  ['screenshots', 'Prod / stage screenshots']];
const typesOf = f => f.types && f.types.length ? f.types : ['other'];

function downloadReport() {
  const all = allIssues();
  const cats = CATS.map(([c, l]) => ({ c, l, xs: all.filter(x => x.f.category === c) })).filter(g => g.xs.length);
  const cnt = (xs, pred) => xs.filter(pred).length;
  const sevs = ['error', 'warning', 'info'];
  const box = (name, val, label, n, checked = true) =>
    `<label><input type="checkbox" name="${name}" value="${esc(val)}" ${checked ? 'checked' : ''}>${esc(label)}${n != null ? `<span class="n">${n}</span>` : ''}</label>`;
  const dlg = document.createElement('dialog');
  dlg.className = 'rpt';
  dlg.innerHTML = `<form method="dialog">
    <div class="rh"><h2>Download report</h2>
      <button type="button" class="btn sm" data-all>Select all</button><button type="button" class="btn sm" data-none>Clear</button>
      <button type="button" class="btn sm" data-cur title="Tick what the Issues tab currently shows (category, types, severity, critical)">Use Issues tab filters</button></div>
    <div class="rb">
      <div class="muted">Pick the issue types to include. Each type shows how many issues it has in this run; the report holds exactly the issues counted below.</div>
      ${cats.map(g => {
        const types = [...new Set(g.xs.flatMap(x => typesOf(x.f)))].sort();
        return `<fieldset data-cat="${g.c}"><legend>${box('cat', g.c, g.l, g.xs.length)}</legend>
          <div class="types">${types.map(t => box('type', g.c + '|' + t, t, cnt(g.xs, x => typesOf(x.f).includes(t)))).join('')}</div></fieldset>`;
      }).join('')}
      <fieldset><legend>Severity and flags</legend><div class="row">
        ${sevs.map(v => box('sev', v, v[0].toUpperCase() + v.slice(1), cnt(all, x => x.f.severity === v))).join('')}
        ${box('crit', '1', 'Critical only', cnt(all, x => x.f.critical), false)}
        ${box('gen', '1', 'Genuine issues only', cnt(all, x => x.f.genuine), false)}
        ${box('shown', '1', 'Only issues matching the Issues tab search / section / topic', null, false)}</div></fieldset>
      <fieldset><legend>Include in the PDF</legend><div class="row">${REPORT_PARTS.map(([k, l]) => box('part', k, l, null)).join('')}</div></fieldset>
    </div>
    <div class="rf"><span class="count"></span>
      <label>Format <select name="format"><option value="pdf">PDF (with screenshots)</option><option value="csv">CSV / Excel</option></select></label>
      <button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn primary" data-go>⬇ Download</button></div></form>`;
  document.body.appendChild(dlg);
  const $$ = sel => [...dlg.querySelectorAll(sel)];
  const on = name => new Set($$(`input[name="${name}"]:checked`).map(i => i.value));
  const picked = () => {
    const types = on('type'), sv = on('sev'), crit = on('crit').size, gen = on('gen').size, shown = on('shown').size;
    return all.filter(x => sv.has(x.f.severity) && (!crit || x.f.critical) && (!gen || x.f.genuine)
      && typesOf(x.f).some(t => types.has(x.f.category + '|' + t)) && (!shown || matches(x)));
  };
  const sync = () => {  // category box = all / some / none of its types
    $$('fieldset[data-cat]').forEach(fs => {
      const ts = [...fs.querySelectorAll('input[name="type"]')], n = ts.filter(i => i.checked).length, c = fs.querySelector('input[name="cat"]');
      c.checked = n === ts.length; c.indeterminate = n > 0 && n < ts.length;
    });
    const n = picked().length;
    dlg.querySelector('.count').textContent = `${n} of ${all.length} issue(s) will be in the report`;
    dlg.querySelector('[data-go]').disabled = !n;
  };
  dlg.addEventListener('change', e => {
    if (e.target.name === 'cat') e.target.closest('fieldset').querySelectorAll('input[name="type"]').forEach(i => { i.checked = e.target.checked; });
    sync();
  });
  const setAll = v => { $$('input[name="type"], input[name="sev"]').forEach(i => { i.checked = v; }); sync(); };
  dlg.querySelector('[data-all]').onclick = () => setAll(true);
  dlg.querySelector('[data-none]').onclick = () => setAll(false);
  dlg.querySelector('[data-cur]').onclick = () => {
    $$('input[name="type"]').forEach(i => {
      const [c, t] = i.value.split('|');
      i.checked = (R.cat === 'all' || R.cat === c) && (!R.types.size || R.types.has(t));
    });
    $$('input[name="sev"]').forEach(i => { i.checked = !R.sevs.size || R.sevs.has(i.value); });
    dlg.querySelector('input[name="crit"]').checked = !!R.critOnly;
    dlg.querySelector('input[name="shown"]').checked = !!(R.q || R.section || R.topic);
    sync();
  };
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('[data-cancel]').onclick = close;
  dlg.addEventListener('cancel', () => setTimeout(() => dlg.remove()));
  dlg.querySelector('[data-go]').onclick = async e => {
    const list = picked(), types = on('type'), totalTypes = $$('input[name="type"]').length;
    const tnames = [...new Set([...types].map(v => v.split('|')[1]))];
    const note = [types.size === totalTypes ? 'all issue types' : 'types: ' + tnames.join(', '),
      on('sev').size === 3 ? '' : 'severity: ' + [...on('sev')].join(', '),
      on('crit').size ? 'critical only' : '', on('gen').size ? 'genuine issues only' : '',
      on('shown').size ? 'Issues tab search / section' : ''].filter(Boolean).join('; ');
    const parts = on('part'), include = Object.fromEntries(REPORT_PARTS.map(([k]) => [k, parts.has(k)]));
    const format = dlg.querySelector('select[name="format"]').value;
    const label = types.size === totalTypes && !on('crit').size && !on('gen').size && on('sev').size === 3 && !on('shown').size ? 'all'
      : tnames.length <= 3 ? tnames.join('-') : 'selected';
    await sendReport(e.currentTarget, { include, filter: { ids: list.map(x => x.f.id), note }, label, format });
    close();
  };
  dlg.showModal();
  sync();
}

async function sendReport(btn, body) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = body.format === 'csv' ? 'Building the CSV…' : 'Building the report…';
  try {
    // built from this run's results, so a run made before the report order changed gets it too
    const res = await fetch(`/api/runs/${R.job.id}/report`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                              body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const blob = await res.blob();
    const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'parity-report.pdf';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (err) { alert('Report failed: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}

const kindNote = k => k === 'aligned' ? ' · not present — aligned position' : k === 'section' ? ' · not present — section start'
  : k === 'section-slot' ? ' · not present — where the missing section belongs' : '';

function openLightbox(i) {
  const base = `/runs/${R.job.id}/`;
  const show = k => {
    i = (k + current.length) % current.length;
    const { f, s } = current[i], sh = f.shots || {};
    lb.innerHTML = `<div class="lb-head"><span class="badge b-${f.severity}">${f.severity}</span><b>${CAT_LABEL[f.category]} · ${esc(f.types.join(', '))}</b>
      <span class="msg">${esc(s.title)} — ${esc(f.message.split('\n')[0])}</span><span class="small">${i + 1} / ${current.length} · ← → to browse · Esc to close</span>
      <button class="btn sm" data-x>Close</button></div>
      <div class="lb-body"><figure><figcaption>Prod · p.${sh.baseline_page ?? '?'}${kindNote(sh.baseline_kind)}</figcaption>${sh.baseline ? `<img src="${base}${sh.baseline}" alt="">` : ''}</figure>
      <figure><figcaption>Stage · p.${sh.candidate_page ?? '?'}${kindNote(sh.candidate_kind)}</figcaption>${sh.candidate ? `<img src="${base}${sh.candidate}" alt="">` : ''}</figure></div>`;
  };
  const lb = document.createElement('div');
  lb.className = 'lightbox'; lb.tabIndex = -1;
  const close = () => { lb.remove(); removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); };
  lb.onclick = e => { if (e.target === lb || e.target.closest('[data-x]')) close(); };
  addEventListener('keydown', key);
  document.body.appendChild(lb);
  show(i);
}

route();
</script>
</body>
</html>
